<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5;--bg-warm:#F3EDE6;--surface:#FFFFFF;--surface-alt:#FDFCFA;
  --border:#E4DDD4;--border-light:#EDE8E1;
  --text:#3A3230;--text-sec:#78706A;--text-muted:#B0A89F;
  --gold:#B8963E;--gold-light:#F7F0E0;--gold-dark:#96792F;
  --deep:#2C2422;
  --plum:#6E4B5E;--plum-light:#F3ECF0;--plum-mid:#8B6578;
  --sage:#5C7A6B;--sage-light:#EBF2ED;--sage-mid:#4A6857;
  --ember:#B85C38;--ember-light:#FBF0EB;
  --sky:#4A7A9B;--sky-light:#EAF1F6;
  --radius:10px;--radius-lg:16px;--radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(58,50,48,.06);
  --shadow-md:0 4px 16px rgba(58,50,48,.08);
  --shadow-lg:0 8px 32px rgba(58,50,48,.1);
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Outfit',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── NAV ────────────────────────────── */
.nav{background:var(--deep);padding:0 32px;}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo{width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--font-display);font-size:15px;font-weight:600;}
.nav-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:#F3EDE6;letter-spacing:.02em;}
.nav-center{display:flex;gap:4px;}
.nav-link{font-size:13.5px;font-weight:500;color:#B0A89F;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;background:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.nav-link:hover{color:#F3EDE6;background:rgba(255,255,255,.08);}
.nav-link.active{color:#F3EDE6;background:rgba(184,150,62,.18);}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#78706A;}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);}
.nav-dot.off{background:var(--ember);}

/* ── USER TOGGLE ─────────────────────── */
.user-toggle{display:flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;gap:2px;}
.user-btn{font-size:13px;font-weight:600;padding:6px 16px;border-radius:6px;border:none;cursor:pointer;transition:all .2s;font-family:var(--font-body);}
.user-btn.inactive{background:none;color:#B0A89F;}
.user-btn.inactive:hover{color:#F3EDE6;}
.user-btn.paula{background:var(--plum);color:#fff;}
.user-btn.gabby{background:var(--sage);color:#fff;}

/* ── MAIN ────────────────────────────── */
.main{max-width:1200px;margin:0 auto;padding:32px 32px 60px;}

/* ── DASHBOARD ────────────────────────── */
.dash-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
.dash-greeting{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--deep);margin-bottom:3px;}
.dash-date{font-size:14px;color:var(--text-sec);}

/* ── STAT CARDS ───────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;position:relative;overflow:hidden;transition:box-shadow .2s,transform .15s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.c1::after{background:var(--text-muted);}
.stat-card.c2::after{background:var(--sky);}
.stat-card.c3::after{background:var(--ember);}
.stat-card.c4::after{background:var(--sage);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.stat-icon.c1{background:var(--bg-warm);color:var(--text-sec);}
.stat-icon.c2{background:var(--sky-light);color:var(--sky);}
.stat-icon.c3{background:var(--ember-light);color:var(--ember);}
.stat-icon.c4{background:var(--sage-light);color:var(--sage);}
.stat-value{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--deep);line-height:1;margin-bottom:3px;}
.stat-label{font-size:12.5px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;}

/* ── BILLING PIPELINE ─────────────────── */
.billing-placeholder{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;text-align:center;margin-bottom:28px;position:relative;overflow:hidden;}
.billing-placeholder::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(184,150,62,.03) 20px,rgba(184,150,62,.03) 40px);}
.billing-inner{position:relative;}
.billing-pipeline{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:20px;}
.billing-stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 28px;}
.billing-stage-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:var(--surface);}
.billing-stage.s-new .billing-stage-icon{border-color:var(--text-muted);color:var(--text-sec);}
.billing-stage.s-pending .billing-stage-icon{border-color:var(--sky);color:var(--sky);background:var(--sky-light);}
.billing-stage.s-unbilled .billing-stage-icon{border-color:var(--ember);color:var(--ember);background:var(--ember-light);}
.billing-stage.s-billed .billing-stage-icon{border-color:var(--sage);color:var(--sage);background:var(--sage-light);}
.billing-stage-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
.billing-stage-count{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--deep);}
.billing-arrow{color:var(--border);margin-top:-20px;display:flex;align-items:center;}
.billing-note{font-size:13px;color:var(--text-muted);font-style:italic;}

/* ── CONTENT GRID ─────────────────────── */
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;}

/* ── PANELS ───────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border-light);}
.panel-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--deep);}
.panel-action{font-size:13px;color:var(--gold);font-weight:500;cursor:pointer;border:none;background:none;transition:color .15s;}
.panel-action:hover{color:var(--gold-dark);}

/* ── TABLE ─────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:9px 22px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border-light);background:var(--surface-alt);}
th.center{text-align:center;}
td{padding:11px 22px;border-bottom:1px solid var(--border-light);}
td.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-sec);}
tbody tr{transition:background .1s;}
tbody tr:hover{background:var(--bg-warm);}
.name-cell{font-weight:500;color:var(--deep);}
.badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-plum{background:var(--plum-light);color:var(--plum);}
.badge-ember{background:var(--ember-light);color:var(--ember);}
.pct-bar{display:inline-flex;align-items:center;gap:6px;}
.pct-bar-track{width:48px;height:5px;background:var(--border-light);border-radius:3px;overflow:hidden;display:inline-block;}
.pct-bar-fill{height:100%;border-radius:3px;}
.pct-bar-fill.plum{background:var(--plum);}
.pct-bar-fill.sage{background:var(--sage);}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;display:flex;transition:color .15s;}
.edit-btn:hover{color:var(--gold);}
.empty-panel{text-align:center;padding:40px 22px;color:var(--text-muted);font-size:14px;}

/* ── SIDEBAR ───────────────────────────── */
.sidebar{display:flex;flex-direction:column;gap:16px;}
.qa-list{padding:18px 22px;display:flex;flex-direction:column;gap:8px;}
.qa-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;color:var(--deep);font-family:var(--font-body);text-align:left;width:100%;}
.qa-btn:hover{background:var(--bg-warm);border-color:var(--gold);box-shadow:var(--shadow-sm);}
.qa-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qa-icon.gold{background:var(--gold-light);color:var(--gold);}
.qa-icon.sage{background:var(--sage-light);color:var(--sage);}
.qa-icon.plum{background:var(--plum-light);color:var(--plum);}
.qa-text{display:flex;flex-direction:column;}
.qa-label{font-weight:600;font-size:14px;}
.qa-hint{font-size:12px;color:var(--text-muted);font-weight:400;}

/* ── SEARCH ─────────────────────────────── */
.search-bar{position:relative;margin-bottom:20px;}
.search-bar .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;display:flex;}
.search-input{width:100%;padding:12px 44px 12px 46px;font-size:14px;font-family:var(--font-body);border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-light);}
.clear-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;display:flex;}

/* ── FORM LAYOUT ─────────────────────────── */
.form-wrap{max-width:700px;margin:0 auto;padding-bottom:40px;}
.form-page-title{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--deep);margin-bottom:24px;}

/* ── FORM SECTIONS ───────────────────────── */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 26px;margin-bottom:16px;}
.form-section-title{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--deep);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border-light);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
.field-full{grid-column:1/-1;}
label.field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-sec);display:block;margin-bottom:6px;} label.field-label .req{color:var(--ember);margin-left:2px;font-size:10px;}
.input,.select-input{width:100%;padding:10px 14px;font-size:14px;font-family:var(--font-body);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;}
.input:focus,.select-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-light);}
.input.error{border-color:var(--ember);background:var(--ember-light);}
.input.mono{font-family:var(--font-mono);}
.error-text{font-size:12px;color:var(--ember);margin-top:4px;display:none;}

/* ── CUSTOMER REF COMPOSITE ──────────────── */
.ref-wrap{display:flex;align-items:center;gap:0;}
.ref-prefix{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text-sec);background:var(--bg-warm);border:1px solid var(--border);border-right:none;border-radius:var(--radius) 0 0 var(--radius);padding:10px 12px;white-space:nowrap;user-select:none;}
.ref-suffix{font-family:var(--font-mono);font-size:14px;border-radius:0 var(--radius) var(--radius) 0 !important;flex:1;}

/* ── ITEM CARDS ───────────────────────────── */
.items-stack{display:flex;flex-direction:column;gap:12px;}
.item-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;}
.item-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.item-card-num{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
.item-card-remove{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;display:flex;transition:color .15s;}
.item-card-remove:hover{color:var(--ember);}
.item-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.item-card-bottom{display:grid;grid-template-columns:140px 1fr;gap:12px 16px;margin-top:12px;align-items:end;}

/* ── COST FIELD ───────────────────────────── */
.cost-wrap{position:relative;}
.cost-symbol{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-sec);font-family:var(--font-mono);pointer-events:none;}
.cost-input{padding-left:26px !important;}

/* ── SPLIT SLIDER ─────────────────────────── */
.split-wrap{display:flex;flex-direction:column;gap:10px;}
.split-names{display:flex;justify-content:space-between;}
.split-name{font-size:12px;font-weight:600;color:var(--text-sec);}
.split-slider-wrap{position:relative;padding:6px 0;}
.split-track{height:4px;border-radius:2px;background:var(--border-light);position:relative;}
.split-track-fill{position:absolute;left:0;top:0;height:100%;background:var(--gold);border-radius:2px;transition:width .05s;}
.split-thumb-wrap{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .05s;}
.split-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--gold);box-shadow:0 1px 6px rgba(58,50,48,.18);cursor:grab;}
.split-thumb:active{cursor:grabbing;box-shadow:0 0 0 6px rgba(184,150,62,.15);}
.split-input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;margin:0;}
.split-input::-webkit-slider-thumb{width:20px;height:20px;cursor:grab;}
.split-pcts{display:flex;justify-content:space-between;}
.split-pct{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-sec);}

/* ── ADD ITEM BUTTON ─────────────────────── */
.add-item-btn{width:100%;padding:14px;border:2px dashed var(--border);border-radius:var(--radius-lg);background:transparent;cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--text-muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.add-item-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-light);}

/* ── FORM STICKY HEADER ──────────────────── */
.form-sticky-header{position:sticky;top:64px;z-index:90;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.form-sticky-title{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--deep);}
.form-sticky-actions{display:flex;gap:10px;}

/* ── BUTTONS ────────────────────────────── */
.btn{font-size:14px;font-weight:600;padding:10px 22px;border-radius:var(--radius);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;font-family:var(--font-body);}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.btn-primary{background:var(--deep);color:#F3EDE6;}
.btn-primary:hover{background:#3D302D;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gold-dark);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);font-weight:500;}
.btn-small{font-size:13px;padding:7px 14px;border-radius:8px;font-weight:500;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);}
.btn:disabled{opacity:.4;cursor:default;transform:none;}

/* ── SPLIT BUTTON ─────────────────────── */
.split-btn-wrap{position:relative;display:inline-flex;}
.split-btn-main{border-radius:var(--radius) 0 0 var(--radius) !important;}
.split-btn-arrow{border-radius:0 var(--radius) var(--radius) 0 !important;padding:10px 10px !important;border-left:1px solid rgba(255,255,255,.2) !important;}
.split-btn-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);min-width:180px;z-index:200;overflow:hidden;display:none;}
.split-btn-dropdown.open{display:block;}
.split-btn-option{display:block;width:100%;padding:11px 16px;font-size:13.5px;font-family:var(--font-body);font-weight:500;color:var(--text);background:none;border:none;cursor:pointer;text-align:left;transition:background .15s;}
.split-btn-option:hover{background:var(--bg-warm);}

/* ── TOAST ──────────────────────────────── */
.toast{position:fixed;top:20px;right:20px;z-index:999;background:var(--deep);color:#F3EDE6;padding:12px 22px;border-radius:var(--radius);font-size:14px;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;font-weight:500;}
.toast.warn{background:var(--ember);}

/* ── LOADING ────────────────────────────── */
.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:var(--deep);}
.spinner{width:36px;height:36px;border:3px solid rgba(184,150,62,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
.loading-text{font-family:var(--font-display);font-size:15px;color:#B0A89F;}

@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .4s ease both;}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

@media(max-width:900px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .content-grid{grid-template-columns:1fr;}
  .main{padding:24px 16px 60px;}
  .billing-pipeline{flex-wrap:wrap;}
  .billing-arrow{display:none;}
}
@media(max-width:640px){
  .stats-row{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .field-full{grid-column:1;}
  .item-card-grid{grid-template-columns:1fr;}
  .item-card-bottom{grid-template-columns:1fr;}
  .nav-center{display:none;}
}
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><div class="loading-text">Connecting…</div></div></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════════════════════════════
const SB_URL='https://ytmyfarsptkezxkgpcbo.supabase.co';
const SB_KEY='sb_publishable_2POAMJdA5U1FPSgxzDy1oA_EfCnF6I2';

const hdrs=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'});

async function sb(table,method,body,q){
  const r=await fetch(SB_URL+'/rest/v1/'+table+(q||''),{method,headers:hdrs(),...(body?{body:JSON.stringify(body)}:{})});
  if(!r.ok)throw new Error('Supabase '+r.status+': '+await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
const sbAll=(t,q)=>sb(t,'GET',null,'?select=*'+(q||''));
const sbInsert=(t,r)=>sb(t,'POST',r);
const sbUpdate=(t,id,d)=>sb(t,'PATCH',d,'?id=eq.'+encodeURIComponent(id));
const sbDelete=(t,id)=>sb(t,'DELETE',null,'?id=eq.'+encodeURIComponent(id));
async function fetchPacketItems(packetId){
  try{
    const rows=await sbAll('packet_items','&packet_id=eq.'+packetId);
    return rows||[];
  }catch(e){console.error('fetchPacketItems error:',e);return[];}
}

const sbUpsert=(t,r)=>{const h2=hdrs();h2['Prefer']='resolution=merge-duplicates,return=representation';return fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:h2,body:JSON.stringify(r)}).then(r=>r.ok?r.json():r.text().then(x=>{throw new Error(x)}));};

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let S={
  packets:[],items:[],retailers:[],jobTypes:[],

function fmtD(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();}
function todayISO(){return new Date().toISOString().split('T')[0];}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function tc(s){return s.split(/(\s|-)/).map(w=>/[a-zA-Z]/.test(w)?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w).join('');}
function esc(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function pad3(n){return String(n).padStart(3,'0');}

// Convert stored DD MMM YYYY back to YYYY-MM-DD for date input value
function dateToISO(s){
  if(!s)return '';
  const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const parts=s.split(' ');
  if(parts.length!==3)return '';
  return parts[2]+'-'+months[parts[1]]+'-'+parts[0].padStart(2,'0');
}
function retailerCode(id){const r=S.retailers.find(x=>x.id===id);return r?pad3(r.code):'';}
function retailerName(id){const r=S.retailers.find(x=>x.id===id);return r?r.name:'';}
function jobTypeName(id){const j=S.jobTypes.find(x=>x.id===id);return j?j.name:'';}
function jobTypeCost(id){const j=S.jobTypes.find(x=>x.id===id);return j?j.cost:60;}

function toast(m,w){S.toast={m,w};if(S.tt)clearTimeout(S.tt);S.tt=setTimeout(()=>{S.toast=null;render();},3000);render();}

// showToast — injects a toast directly into DOM without calling render()
// Safe to use inside the form where re-rendering would wipe draft items
let _toastEl=null;let _toastTT=null;
function showToast(m,w){
  if(_toastTT)clearTimeout(_toastTT);
  if(!_toastEl){
    _toastEl=document.createElement('div');
    document.getElementById('app').appendChild(_toastEl);
  }
  _toastEl.className='toast'+(w?' warn':'');
  _toastEl.textContent=m;
  _toastEl.style.display='block';
  _toastTT=setTimeout(()=>{if(_toastEl)_toastEl.style.display='none';},3000);
}

async function loadAll(){
  try{
    S.packets=await sbAll('packets','&order=created.desc');
    S.items=await sbAll('items');
    S.retailers=await sbAll('retailers','&order=name.asc');
    S.jobTypes=await sbAll('job_types','&order=name.asc');
    S.online=true;
  }catch(e){console.error(e);S.online=false;throw e;}
}

function myPackets(){
  // Dashboard filters to current user — we need packet_items for this
  // For now filter packets where we have any items (all shown, split shown per user)
  return S.packets;
}

function getFiltered(){
  const pkts=S.packets;
  if(!S.search)return pkts;
  const s=S.search.toLowerCase();
  return pkts.filter(r=>[r.surname,r.customer_ref,r.date].some(v=>(v||'').toLowerCase().includes(s)));
}

function getStats(){
  const pkts=myPackets();
  const byStatus={new:0,pending:0,unbilled:0,billed:0};
  pkts.forEach(r=>{const st=r.status||'new';if(byStatus[st]!==undefined)byStatus[st]++;else byStatus.new++;});
  const retailers={};
  pkts.forEach(r=>{const n=retailerName(r.retailer_id)||'Unknown';retailers[n]=(retailers[n]||0)+1;});
  return{total:pkts.length,byStatus,retailers};
}

async function savePacket(headerData, itemsData){
  const now=fmtD(new Date());
  const pid=gid();
  const packet={
    id:pid,
    date:headerData.date,
    retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,
    surname:headerData.surname,
    status:'new',
    created:now,
    modified:now,
  };
  await sbInsert('packets',packet);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Navigate to edit mode so user can review and add more items
  S.view='edit';
  S.editId=pid;
  toast('Work packet saved');
  await renderAsync();
}

async function updatePacket(pid, headerData, itemsData){
  const now=fmtD(new Date());
  await sbUpdate('packets',pid,{
    date:headerData.date,retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,surname:headerData.surname,modified:now,
  });
  // Delete old items and reinsert — simplest approach for now
  const existing=await sbAll('packet_items','&packet_id=eq.'+pid);
  if(existing)for(const e of existing)await sbDelete('packet_items',e.id);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Stay in edit mode after update
  S.view='edit';
  toast('Work packet updated');
  await renderAsync();
}

function downloadCSV(){
  const h=['Packet ID','Date','Retailer','Customer Ref','Surname','Status','Item','Job Type','Cost','Paula %','Gabrielle %'];
  // For CSV we just export packets for now — items join coming later
  const rows=S.packets.map(p=>[p.id,p.date,retailerName(p.retailer_id),p.customer_ref,p.surname,p.status||'new','','','','',''].map(esc).join(','));
  const csv=[h.join(','),...rows].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='billing_'+S.user+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('CSV downloaded');
}

function h(tag,a,...ch){
  const el=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')el.className=v;
    else if(k==='htmlContent')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch.flat()){if(c==null||c===false)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;
}

  tbl.append(tb);panel.append(tbl);c.append(panel);return c;
}

// ═══════════════════════════════════════════════════════════════════════════
// FORM — NEW WORK PACKET
// ═══════════════════════════════════════════════════════════════════════════
function renderForm(packet){
  const isEdit=!!packet;
  const defaultPct=S.user==='paula'?100:0;

  // Guard — if lookups not loaded yet
  if(!S.retailers.length||!S.jobTypes.length||!S.items.length){
    const retryBtn=h('button',{className:'btn btn-secondary',style:{marginTop:'16px'},onClick:async()=>{await loadAll();render();}});
    retryBtn.innerHTML='Retry';
    return h('div',{className:'form-wrap fade-up'},
      h('h1',{className:'form-page-title'},'New Work Packet'),
      h('div',{className:'form-section'},
        h('p',{style:{fontFamily:'var(--font-body)',fontSize:'14px',color:'var(--ember)'}},'Lookup data not loaded. Check Supabase tables (retailers, items, job_types) exist and contain data.'),
        retryBtn,
      )
    );
  }

  // Header state
  const hdr={
    dateISO:packet?dateToISO(packet.date):todayISO(),
    date:packet?packet.date:fmtD(new Date()),
    retailerId:packet?packet.retailer_id:S.retailers[0].id,
    customerRef:packet?packet.customer_ref:'',
    refSuffix:'',
    surname:packet?packet.surname:'',
  };

  // Derive suffix from existing ref
  if(packet&&packet.customer_ref){
    const parts=packet.customer_ref.split('-');
    hdr.refSuffix=parts.length>1?parts.slice(1).join('-'):packet.customer_ref;
  }

  const makeItem=()=>({
    id:gid(),
    item:S.items[0]?.name||'',
    jobTypeId:S.jobTypes[0]?.id||null,
    cost:S.jobTypes[0]?.cost||60,
    paulaPct:defaultPct,
    gabriellePct:100-defaultPct,
  });

  // Items loaded from Supabase for edit, or a blank card for new
  // Note: renderForm is synchronous so we pre-load items into S.editItems
  // before calling renderForm, then clear them after
  const formItems=[];
  if(isEdit && S.editItems && S.editItems.length){
    S.editItems.forEach(row=>{
      const jt=S.jobTypes.find(j=>j.id===row.job_type_id);
      if(!jt){
        // Job type no longer in lookup — show warning card with raw values
        formItems.push({
          id:row.id,
          item:row.item||S.items[0]?.name||'',
          jobTypeId:S.jobTypes[0]?.id||null,
          cost:parseFloat(row.cost)||60,
          paulaPct:row.paula_pct||0,
          gabriellePct:row.gabrielle_pct||100,
          _warning:'Job type not found in lookup (id:'+row.job_type_id+')',
        });
      } else {
        formItems.push({
          id:row.id,
          item:row.item||S.items[0]?.name||'',
          jobTypeId:row.job_type_id,
          cost:parseFloat(row.cost)||jt.cost,
          paulaPct:row.paula_pct||0,
          gabriellePct:row.gabrielle_pct||100,
        });
      }
    });
  } else {
    formItems.push(makeItem());
  }

  // ── STICKY FORM HEADER ──
  const isEditTitle=isEdit?'Edit Work Packet':'New Work Packet';

  // ── WRAP ──
  const wrap=h('div',{className:'form-wrap fade-up'});

  // ── HEADER SECTION ──
  const headerSection=h('div',{className:'form-section'});
  headerSection.append(h('div',{className:'form-section-title'},'Packet Details'));
  const headerGrid=h('div',{className:'form-grid'});

  // Date (full width)
  const dateFld=h('div',{className:'field-full'},h('label',{className:'field-label'},'Date *'));
  const dateIn=h('input',{type:'date',className:'input',value:hdr.dateISO,style:{maxWidth:'220px'}});
  dateIn.addEventListener('input',e=>{hdr.dateISO=e.target.value;if(e.target.value){const[y,m,d]=e.target.value.split('-');hdr.date=fmtD(new Date(+y,+m-1,+d));}});
  dateFld.append(dateIn);headerGrid.append(dateFld);

  // Retailer
  const retFld=h('div',{},h('label',{className:'field-label'},'Retailer *'));
  const retSel=h('select',{className:'select-input'});
  S.retailers.forEach(r=>{const o=h('option',{value:String(r.id)},r.name);if(r.id===hdr.retailerId)o.selected=true;retSel.append(o);});
  const prefixDisplay=h('span',{className:'ref-prefix'},pad3(S.retailers.find(r=>r.id===hdr.retailerId)?.code||0)+'-');
  retSel.addEventListener('change',e=>{
    hdr.retailerId=parseInt(e.target.value);
    const r=S.retailers.find(x=>x.id===hdr.retailerId);
    prefixDisplay.textContent=pad3(r?.code||0)+'-';
    updateFullRef();
    refSufIn.classList.remove('error');refErr.style.display='none';
  });
  retFld.append(retSel);headerGrid.append(retFld);

  // Customer Ref
  function updateFullRef(){
    const r=S.retailers.find(x=>x.id===hdr.retailerId);
    hdr.customerRef=pad3(r?.code||0)+'-'+hdr.refSuffix;
  }
  const refFld=h('div',{},h('label',{className:'field-label'},'Customer Reference *'));
  const refErr=h('span',{className:'error-text'},'Enter 4–5 digits after the dash');
  const refWrap=h('div',{className:'ref-wrap'});
  const refSufIn=h('input',{type:'text',className:'input mono ref-suffix',placeholder:'',maxLength:'5',value:hdr.refSuffix,inputMode:'numeric'});
  refSufIn.addEventListener('input',e=>{
    hdr.refSuffix=e.target.value.replace(/\D/g,'').slice(0,5);
    refSufIn.value=hdr.refSuffix;
    updateFullRef();
    refSufIn.classList.remove('error');refErr.style.display='none';
  });
  // Tab from retailer should focus ref suffix
  retSel.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();refSufIn.focus();}});
  refWrap.append(prefixDisplay,refSufIn);
  refFld.append(refWrap,refErr);headerGrid.append(refFld);

  // Surname (full width)
  const surFld=h('div',{className:'field-full'},h('label',{className:'field-label'},'Surname *'));
  const surErr=h('span',{className:'error-text'},'Surname is required');
  const surIn=h('input',{className:'input',placeholder:'',value:hdr.surname});
  surIn.addEventListener('input',e=>{hdr.surname=tc(e.target.value);surIn.value=hdr.surname;surIn.classList.remove('error');surErr.style.display='none';});
  surFld.append(surIn,surErr);headerGrid.append(surFld);

  headerSection.append(headerGrid);
  wrap.append(headerSection);

  // ── ITEMS SECTION ──
  const itemsSection=h('div',{className:'form-section'});
  itemsSection.append(h('div',{className:'form-section-title'},'Items'));
  const itemsStack=h('div',{className:'items-stack'});

  function buildItemCard(item,index){
    const card=h('div',{className:'item-card'});

    // Card header
    const cardHdr=h('div',{className:'item-card-header'});
    cardHdr.append(h('span',{className:'item-card-num'},'Item '+(index+1)));
    if(formItems.length>1){
      const rmBtn=h('button',{className:'item-card-remove',title:'Remove item',onClick:()=>{
        formItems.splice(index,1);
        rebuildItemsStack();
      }});rmBtn.innerHTML=I.trash;cardHdr.append(rmBtn);
    }
    card.append(cardHdr);

    // Warning if job type not found in lookup
    if(item._warning){
      card.append(h('p',{style:{fontSize:'12px',color:'var(--ember)',marginBottom:'10px',fontFamily:'var(--font-body)'}},
        '⚠ '+item._warning));
    }

    // Item + Job Type row
    const topGrid=h('div',{className:'item-card-grid'});

    // Item dropdown
    const itFld=h('div',{},h('label',{className:'field-label'},'Item'));
    const itSel=h('select',{className:'select-input'});
    S.items.forEach(i=>{const o=h('option',{value:i.name},i.name);if(i.name===item.item)o.selected=true;itSel.append(o);});
    itSel.addEventListener('change',e=>{item.item=e.target.value;});
    itFld.append(itSel);topGrid.append(itFld);

    // Job Type dropdown
    const jtFld=h('div',{},h('label',{className:'field-label'},'Job Type'));
    const jtSel=h('select',{className:'select-input'});
    S.jobTypes.forEach(jt=>{const o=h('option',{value:String(jt.id)},jt.name);if(jt.id===item.jobTypeId)o.selected=true;jtSel.append(o);});
    const costIn=h('input',{type:'number',className:'input mono cost-input',step:'5',min:'0',value:item.cost?item.cost.toFixed(2):''});
    jtSel.addEventListener('change',e=>{
      item.jobTypeId=parseInt(e.target.value);
      item.cost=jobTypeCost(item.jobTypeId);
      costIn.value=item.cost.toFixed(2);
    });
    jtFld.append(jtSel);topGrid.append(jtFld);
    card.append(topGrid);

    // Cost + Split row
    const bottomRow=h('div',{className:'item-card-bottom'});

    // Cost
    const costFld=h('div',{},h('label',{className:'field-label'},'Cost'));
    const costWrap=h('div',{className:'cost-wrap'});
    costWrap.append(h('span',{className:'cost-symbol'},'$'),costIn);
    costIn.addEventListener('input',e=>{item.cost=parseFloat(e.target.value)||0;});
    costFld.append(costWrap);bottomRow.append(costFld);

    // Work Split — MUI-style continuous slider
    // Slider value = Paula's %, left = Paula, right = Gabby
    // Dragging left increases Paula, dragging right increases Gabby
    const splitFld=h('div',{},h('label',{className:'field-label'},'Work Split'));
    const splitWrap=h('div',{className:'split-wrap'});

    // Slider value = Gabby's %. Far right = 100% Gabby, far left = 100% Paula.
    const paulaPctLbl=h('span',{className:'split-pct'},item.paulaPct+'%');
    const gabbyPctLbl=h('span',{className:'split-pct'},item.gabriellePct+'%');
    // Track fill grows from left as Gabby's % increases — thumb position = Gabby%
    const trackFill=h('div',{className:'split-track-fill',style:{width:item.gabriellePct+'%'}});
    const thumbWrap=h('div',{className:'split-thumb-wrap',style:{left:item.gabriellePct+'%'}},h('div',{className:'split-thumb'}));
    const track=h('div',{className:'split-track'},trackFill,thumbWrap);
    const sliderIn=h('div',{className:'split-slider-wrap'},track);

    // Range value = Gabby's %. Drag right → Gabby increases, Paula decreases.
    const rangeIn=h('input',{type:'range',className:'split-input',min:'0',max:'100',step:'5',value:String(item.gabriellePct)});
    sliderIn.appendChild(rangeIn);

    rangeIn.addEventListener('input',e=>{
      const g=Math.round(parseInt(e.target.value)/5)*5;
      item.gabriellePct=g;item.paulaPct=100-g;
      trackFill.style.width=g+'%';
      thumbWrap.style.left=g+'%';
      gabbyPctLbl.textContent=g+'%';
      paulaPctLbl.textContent=(100-g)+'%';
    });

    splitWrap.append(
      h('div',{className:'split-names'},
        h('span',{className:'split-name'},'◀ Paula'),
        h('span',{className:'split-name'},'Gabby ▶'),
      ),
      sliderIn,
      h('div',{className:'split-pcts'},paulaPctLbl,gabbyPctLbl),
    );
    splitFld.append(splitWrap);bottomRow.append(splitFld);
    card.append(bottomRow);
    return card;
  }

  // Add item button — declared BEFORE rebuildItemsStack so it's in scope
  const addItemBtn=h('button',{className:'add-item-btn',onClick:()=>{
    if(formItems.length>=3)return;
    formItems.push(makeItem());
    rebuildItemsStack();
  }});
  addItemBtn.innerHTML=I.plus+'  Add Another Item';

  function rebuildItemsStack(){
    itemsStack.innerHTML='';
    formItems.forEach((item,i)=>itemsStack.append(buildItemCard(item,i)));
    addItemBtn.style.display=formItems.length>=3?'none':'flex';
  }

  rebuildItemsStack();
  itemsSection.append(itemsStack);
  itemsSection.append(addItemBtn);
  wrap.append(itemsSection);

  // ── STICKY HEADER — declared first so saveBtn is in scope for doSave ──
  const saveBtn=h('button',{className:'btn btn-primary split-btn-main'});
  saveBtn.textContent='Save';

  // Split button dropdown
  const dropdown=h('div',{className:'split-btn-dropdown'});
  const saveNewOpt=h('button',{className:'split-btn-option',onClick:async()=>{
    dropdown.classList.remove('open');
    await doSave(true); // pass flag to open fresh form after save
  }},'Save and Add New');
  dropdown.append(saveNewOpt);

  const arrowBtn=h('button',{className:'btn btn-primary split-btn-arrow',onClick:e=>{
    e.stopPropagation();
    dropdown.classList.toggle('open');
  }});
  arrowBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';

  // Close dropdown on outside click
  document.addEventListener('click',()=>dropdown.classList.remove('open'),{capture:true,once:false});

  const splitBtnWrap=h('div',{className:'split-btn-wrap'},saveBtn,arrowBtn,dropdown);

  const stickyHdr=h('div',{className:'form-sticky-header'},
    h('span',{className:'form-sticky-title'},isEditTitle),
    h('div',{className:'form-sticky-actions'},
      h('button',{className:'btn btn-secondary',onClick:()=>{S.view='home';S.editId=null;render();}},'Cancel'),
      splitBtnWrap,
    ),
  );

  // ── SAVE LOGIC ──
  // IMPORTANT: Never call render() on validation failure — it rebuilds the DOM
  // and wipes formItems. Only manipulate existing DOM elements inline.
  async function doSave(saveAndNew=false){
    let ok=true;
    let firstError=null;

    // Validate Customer Reference suffix (4–5 digits)
    // Manipulate existing DOM only — never call render() or toast() here
    if(!hdr.refSuffix||!/^\d{4,5}$/.test(hdr.refSuffix)){
      ok=false;
      refSufIn.classList.add('error');
      refErr.style.display='block';
      if(!firstError)firstError=refSufIn;
    } else {
      refSufIn.classList.remove('error');
      refErr.style.display='none';
    }

    // Validate Surname
    if(!hdr.surname.trim()){
      ok=false;
      surIn.classList.add('error');
      surErr.style.display='block';
      if(!firstError)firstError=surIn;
    } else {
      surIn.classList.remove('error');
      surErr.style.display='none';
    }

    if(!ok){
      // Show errors inline only — no render(), no toast()
      if(firstError)firstError.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }

    // All valid — call server
    updateFullRef();
    saveBtn.disabled=true;
    arrowBtn.disabled=true;
    saveBtn.textContent='Saving…';
    try{
      if(isEdit)await updatePacket(packet.id,hdr,formItems);
      else await savePacket(hdr,formItems);
      // If Save and Add New — clear editId and go to fresh form
      if(saveAndNew){
        S.editItems=[];
        S.editId=null;
        S.view='form';
        render();
      }
      // Otherwise savePacket/updatePacket handle navigation (edit mode)
    }catch(e){
      showToast('Save failed: '+e.message,true);
      saveBtn.disabled=false;
      arrowBtn.disabled=false;
      saveBtn.textContent='Save';
    }
  }

  saveBtn.addEventListener('click',()=>doSave(false));

  return h('div',{},stickyHdr,wrap);
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  if(!S.ready){app.innerHTML='<div class="loading-screen"><div class="spinner"></div><div class="loading-text">Connecting…</div></div>';return;}
  if(S.toast)app.append(h('div',{className:'toast'+(S.toast.w?' warn':'')},S.toast.m));
  app.append(renderNav());
  const main=h('div',{className:'main'});
  if(S.view==='home')main.append(renderHome());
  else if(S.view==='records')main.append(renderRecords());
  else if(S.view==='form')main.append(renderForm(null));
  else if(S.view==='edit'&&S.editId){
    const p=S.packets.find(x=>x.id===S.editId);
    if(p){
      // editItems already loaded async before render() was called
      main.append(renderForm(p));
    }else{S.view='home';main.append(renderHome());}
  }
  app.append(main);
  if(S.view==='records'&&S.search){const s=app.querySelector('.search-input');if(s){s.focus();s.setSelectionRange(S.search.length,S.search.length);}}
}

// Async render — fetches packet items before rendering edit form
async function renderAsync(){
  if(S.view==='edit'&&S.editId){
    S.editItems=await fetchPacketItems(S.editId);
  } else {
    S.editItems=[];
  }
  render();
}

// Override the nav link clicks and edit buttons to use renderAsync
// (render() itself remains synchronous for all non-edit views)

(async()=>{
  try{await loadAll();S.ready=true;render();}
  catch(e){document.getElementById('app').innerHTML='<div class="loading-screen"><div class="loading-text" style="color:#B85C38;">Connection failed: '+e.message+'<br><br>Check your internet and refresh.</div></div>';}
})();
</script>
</body>
