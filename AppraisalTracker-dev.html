async function sb(table,method,body,q){
  const r=await fetch(SB_URL+'/rest/v1/'+table+(q||''),{method,headers:hdrs(),...(body?{body:JSON.stringify(body)}:{})});
  if(!r.ok)throw new Error('Supabase '+r.status+': '+await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
const sbAll=(t,q)=>sb(t,'GET',null,'?select=*'+(q||''));

function fmtD(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();}
function todayISO(){return new Date().toISOString().split('T')[0];}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function tc(s){return s.split(/(\s|-)/).map(w=>/[a-zA-Z]/.test(w)?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w).join('');}
function esc(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function pad3(n){return String(n).padStart(3,'0');}

// Convert stored DD MMM YYYY back to YYYY-MM-DD for date input value
function dateToISO(s){
  if(!s)return '';
  const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const parts=s.split(' ');
  if(parts.length!==3)return '';
  return parts[2]+'-'+months[parts[1]]+'-'+parts[0].padStart(2,'0');
}

// Badge colour per status name
// Computed per-packet billing display status based on per-user billed flags
// Returns a display label and style independent of status_id
// Returns {paulaDone, gabbyDone} — true when a user is billed or has 0% on all items
function billedStatus(pkt,items){
  const it=items||S.allPacketItems.filter(i=>i.packet_id===pkt.id);
  const paulaDone=(pkt.paula_billed||false)||(it.length>0&&it.every(i=>(i.paula_pct||0)===0));
  const gabbyDone=(pkt.gabby_billed||false)||(it.length>0&&it.every(i=>(i.gabrielle_pct||0)===0));
  return {paulaDone,gabbyDone};
}
function isEffectivelyBilled(pkt,items){const{paulaDone,gabbyDone}=billedStatus(pkt,items);return paulaDone&&gabbyDone;}
function packetBillingLabel(pkt){
  const pb=pkt.paula_billed||false;
  const gb=pkt.gabby_billed||false;
  const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
  if(isEffectivelyBilled(pkt,items))return 'Fully Billed';
  // For 100% packets, the unbilled active user takes priority over showing "Billed (other)"
  if(items.length){
    if(items.every(i=>(i.gabrielle_pct||0)===0)&&!pb)return null;
    if(items.every(i=>(i.paula_pct||0)===0)&&!gb)return null;
  }
  if(pb)return 'Billed (Paula)';
  if(gb)return 'Billed (Gabby)';
  return null;
}

function packetCosts(packetId){
  const pkt=S.packets.find(p=>p.id===packetId);
  const retailer=S.retailers.find(r=>r.id===(pkt?pkt.retailer_id:null));
  const discountMult=retailer?(1-(retailer.discount_pct||0)/100):1;
  const items=S.allPacketItems.filter(i=>i.packet_id===packetId);
  let total=0,paula=0,gabby=0;
  items.forEach(i=>{const c=(parseFloat(i.cost)||0)*discountMult;total+=c;paula+=c*(i.paula_pct||0)/100;gabby+=c*(i.gabrielle_pct||0)/100;});
  return{total,paula,gabby};
}
function parseStoredDate(s){
  if(!s)return null;
  const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const p=s.split(' ');if(p.length!==3)return null;
  return new Date(+p[2],months[p[1]],+p[0]);
}
function getDateRange(key){
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth(),fyYear=mo>=3?yr:yr-1;
  switch(key){
    case 'today':{const d=new Date(yr,mo,now.getDate());return{from:d,to:new Date(yr,mo,now.getDate(),23,59,59)};}
    case 'week':{const d=new Date(now);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);const e=new Date(d);e.setDate(e.getDate()+6);e.setHours(23,59,59);return{from:d,to:e};}
    case 'month':return{from:new Date(yr,mo,1),to:new Date(yr,mo+1,0,23,59,59)};
    case 'lastmonth':{const lm=mo===0?11:mo-1,ly=mo===0?yr-1:yr;return{from:new Date(ly,lm,1),to:new Date(ly,lm+1,0,23,59,59)};}
    case 'thisfy':return{from:new Date(fyYear,3,1),to:new Date(fyYear+1,2,31,23,59,59)};
    case 'lastfy':return{from:new Date(fyYear-1,3,1),to:new Date(fyYear,2,31,23,59,59)};
    case 'lastweek':{const d=now.getDate();const dow=(now.getDay()+6)%7;const mon=new Date(yr,mo,d-dow-7);mon.setHours(0,0,0,0);const sun=new Date(yr,mo,d-dow-1);sun.setHours(23,59,59);return{from:mon,to:sun};}
    default:return null;
  }
}

// showToast -- injects a toast directly into DOM without calling render()
// Safe to use inside the form where re-rendering would wipe draft items
let _toastEl=null;let _toastTT=null;
function showToast(m,w){
  if(_toastTT)clearTimeout(_toastTT);
  if(!_toastEl){
    _toastEl=document.createElement('div');
    document.getElementById('app').appendChild(_toastEl);
  }
  _toastEl.className='toast'+(w?' warn':'');
  _toastEl.textContent=m;
  _toastEl.style.display='block';
  _toastTT=setTimeout(()=>{if(_toastEl)_toastEl.style.display='none';},3000);
}

function showDeleteConfirm(onConfirm){
  const overlay=h('div',{className:'modal-overlay',style:{alignItems:'center'},onClick:e=>{if(e.target===overlay)overlay.remove();}});
  const modal=h('div',{className:'modal',style:{maxWidth:'440px'}});

  const hdr=h('div',{className:'modal-header',style:{borderBottom:'none'}});
  hdr.append(h('h1',{className:'modal-title'},'Delete Work Packet'));
  modal.append(hdr);

  const body=h('div',{className:'modal-body'});
  body.append(h('p',{style:{color:'var(--color-muted-foreground)',lineHeight:'var(--leading-relaxed)'}},'This will permanently delete this packet and all its items. This action cannot be undone.'));
  modal.append(body);

  const foot=h('div',{className:'modal-footer',style:{borderTop:'none'}});
  const cancelBtn=h('button',{className:'btn btn-secondary',onClick:()=>overlay.remove()},'Cancel');
  const deleteBtn=h('button',{className:'btn btn-destructive',onClick:async()=>{
    deleteBtn.disabled=true;deleteBtn.textContent='Deleting...';
    try{await onConfirm();}
    catch(e){showToast('Delete failed: '+e.message,true);deleteBtn.disabled=false;deleteBtn.textContent='Delete';}
  }},'Delete');
  foot.append(cancelBtn,h('div',{className:'modal-footer-right'},deleteBtn));
  modal.append(foot);
  overlay.append(modal);
  document.body.append(overlay);
}

// Dollar value stats for current user
function getDollarStats(){
  const user=S.user;
  const cu=getCurrentUser();
  const taxMult=1-(cu.income_tax_rate||0)/100;
  const now=new Date();
  const yr=now.getFullYear(),mo=now.getMonth(),day=now.getDate();
  // Week start (Monday)
  const weekStart=new Date(yr,mo,day-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);
  const monthStart=new Date(yr,mo,1);

  let unbilled=0,earnedWeek=0,earnedMonth=0;

  S.packets.forEach(p=>{
    const userBilled=user==='paula'?(p.paula_billed||false):(p.gabby_billed||false);
    const sName=statusName(p.status_id);
    if(sName==='Archived')return;
    const retailer=S.retailers.find(r=>r.id===p.retailer_id);
    const discountMult=retailer?(1-(retailer.discount_pct||0)/100):1;
    const items=S.allPacketItems.filter(i=>i.packet_id===p.id);
    const userShare=items.reduce((sum,i)=>{
      const cost=(parseFloat(i.cost)||0)*discountMult;
      const pct=(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
      return sum+cost*pct*taxMult;
    },0);
    if(!userBilled&&sName!=='Hold from Billing'){
      unbilled+=userShare;
    }
    // Earned includes all work (billed or not), excluding Hold and Archived
    if(sName!=='Hold from Billing'){
      const d=parseStoredDate(p.date);
      if(d){
        if(d>=weekStart)earnedWeek+=userShare;
        if(d>=monthStart)earnedMonth+=userShare;
      }
    }
  });
  return{unbilled,earnedWeek,earnedMonth};
}

function getFiltered(){
  // Exclude Archived by default
  let pkts=S.packets.filter(r=>statusShowDash(r.status_id));
  if(!S.search)return pkts;
  const s=S.search.toLowerCase();
  return pkts.filter(r=>[r.surname,r.customer_ref,r.date].some(v=>(v||'').toLowerCase().includes(s)));
}

function getStats(){
  // Exclude Archived from dashboard counts
  const pkts=S.packets.filter(r=>statusShowDash(r.status_id));
  const byStatus={'New':0,'Hold from Billing':0,'Fully Billed':0,'Part Billed':0};
  pkts.forEach(r=>{
    const pb=r.paula_billed||false;
    const gb=r.gabby_billed||false;
    if(pb&&gb)byStatus['Fully Billed']++;
    else if(pb||gb)byStatus['Part Billed']++;
    else{
      const name=statusName(r.status_id);
      if(byStatus[name]!==undefined)byStatus[name]++;
    }
  });
  const retailers={};
  pkts.forEach(r=>{const n=retailerName(r.retailer_id)||'Unknown';retailers[n]=(retailers[n]||0)+1;});
  return{total:pkts.length,byStatus,retailers};
}

async function savePacket(headerData, itemsData){
  const now=fmtD(new Date());
  const pid=gid();
  const packet={
    id:pid,
    date:headerData.date,
    retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,
    sub_customer_id:headerData.subCustomer||null,
    surname:headerData.surname,
    status_id:statusId('New'),
    created:now,
    modified:now,
  };
  await sbInsert('packets',packet);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Navigate to edit mode so user can review and add more items
  S.view='edit';
  S.editId=pid;
  toast('Work packet saved');
  await renderAsync();
}

async function updatePacket(pid, headerData, itemsData){
  const now=fmtD(new Date());
  await sbUpdate('packets',pid,{
    date:headerData.date,retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,surname:headerData.surname,
    sub_customer_id:headerData.subCustomer||null,modified:now,
  });
  // Delete old items and reinsert -- simplest approach for now
  const existing=await sbAll('packet_items','&packet_id=eq.'+pid);
  if(existing)for(const e of existing)await sbDelete('packet_items',e.id);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Stay in edit mode after update
  S.view='edit';
  toast('Work packet updated');
  await renderAsync();
}

function h(tag,a,...ch){
  const el=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')el.className=v;
    else if(k==='htmlContent')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch.flat()){if(c==null||c===false)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;
}

function renderNav(){
  const users=S.users.length?S.users:[{name:'Gabby',slug:'gabby',colour:'#5C7A6B'},{name:'Paula',slug:'paula',colour:'#6E4B5E'}];
  const toggleBtns=h('div',{className:'user-toggle-buttons'});
  const userInfo=h('div',{className:'user-info'},
    h('div',{className:'user-name'},'FirstName Surname'),
    h('div',{className:'user-email'},'user@jamies.co.nz')
  );
  users.filter(u=>u.active!==false).forEach(u=>{
    const isActive=S.user===u.slug;
    const btnClass='user-btn '+(isActive?(u.slug==='paula'?'paula':'gabby'):'inactive');
    const letter=u.slug==='paula'?'P':'G';
    const btn=h('button',{className:btnClass,onClick:()=>{S.user=u.slug;S.billing.selectedItemIds=new Set();S.billing.initialised=false;render();}},letter);
    toggleBtns.append(btn);
  });
  const toggle=h('div',{className:'user-toggle'},toggleBtns,userInfo);
  const isReportsView=['reports','customerReport','billingRunsReport','shippingReport','fulfilmentReport','taxInvoices'].includes(S.view);
  const newBtn=h('button',{className:'btn btn-primary has-icon',style:{justifySelf:'start'},onClick:()=>{S.view='form';render();}},h('span',{htmlContent:'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.36134 12V0H7.61344V12H4.36134ZM0 7.58442V4.41559H12V7.58442H0Z" fill="white"/></svg>',style:{display:'inline-flex',alignItems:'center'}}),'NEW PACKET');
  const isOnline=S.online;

  // Side nav
  const sidenav=h('div',{className:'sidenav'});
  const brand=h('div',{className:'sidenav-brand'},
    h('div',{className:'nav-logo'},h('img',{src:'assets/images/logo.svg'})),
    h('span',{className:'nav-title'},'APPRAISALS ',h('br',{}),'TRACKER')
  );
  sidenav.append(brand);

  const menuSection=h('div',{className:'sidenav-section'},h('div',{className:'sidebar-section-heading'},'Menu'));
  const isShippingView=S.view==='shipping';
  const navLinks=[
    {view:'home',label:'Dashboard',icon:'nav_home'},
    {view:'records',label:'Records',icon:'nav_records'},
    {view:'billing',label:'Billing',icon:'nav_billing'},
    {view:'reports',label:'Reports',icon:'nav_reports'},
    {view:'shipping',label:'Shipping',icon:'nav_shipping'},
  ];
  navLinks.forEach(nl=>{
    const isActive=nl.view==='home'?S.view==='home':nl.view==='reports'?isReportsView:nl.view==='shipping'?isShippingView:S.view===nl.view;
    const link=h('button',{className:'nav-link'+(isActive?' active':''),onClick:()=>{
      if(nl.view==='billing'){S.view='billing';S.billing.step=1;S.billing.selectedItemIds=new Set();S.billing.initialised=false;render();}
      else if(nl.view==='reports'){S.view='reports';render();}
      else if(nl.view==='shipping'){S.view='shipping';S.shippingSelected=new Set();S.shippingFilters={retailerId:null,subCustomer:''};render();}
      else{S.view=nl.view;render();}
    }},ic(nl.icon+(isActive?'_f':'_u')),nl.label);
    menuSection.append(link);
  });
  sidenav.append(menuSection);

  const generalSection=h('div',{className:'sidenav-section'},h('div',{className:'sidebar-section-heading'},'General'));
  const adminLink=h('button',{className:'nav-link'+(S.view==='admin'?' active':'')},ic('nav_settings_u'),'Admin');
  adminLink.addEventListener('click',()=>{S.view='admin';render();});
  generalSection.append(adminLink);
  generalSection.append(h('button',{className:'nav-link disabled'},ic('nav_logout_u'),'Logout'));
  sidenav.append(generalSection);

  const statusCard=h('div',{className:'sidenav-bottom'},
    h('div',{className:'nav-status-card'},
      h('span',{className:'nav-dot'+(isOnline?'':' off')}),
      SB_URL.includes('xwripwrfqdddfomzfjaq')?'Development':'Production'
    )
  );
  sidenav.append(statusCard);

  // Top bar
  const topbar=h('div',{className:'topbar'});
  const searchWrap=h('div',{className:'topbar-search'});
  searchWrap.append(h('span',{className:'s-icon'},ic('search')));
  const searchEl=h('input',{className:'topbar-search-input',type:'text',placeholder:'Search packets...',
    value:S.recFilters&&S.recFilters.search||'',
    onInput:(e)=>{if(S.recFilters){S.searchHadFocus=true;S.searchCursorPos=e.target.selectionStart;S.recFilters.search=e.target.value;render();}}});
  searchWrap.append(searchEl);
  const topSearch=h('div',{style:{gridColumn:'1/3',display:'flex',alignItems:'center'}},searchWrap);
  const topToggle=h('div',{style:{gridColumn:'4',display:'flex',alignItems:'center'}},toggle);
  topbar.append(topSearch,newBtn,topToggle);

  return {sidenav,topbar};
}

      tb.append(h('tr',{style:{cursor:'pointer'},onClick:()=>{S.editId=r.id;S.view='edit';renderAsync();}},

        (()=>{const bl=packetBillingLabel(r);const sn=bl||statusName(r.status_id);return h('td',{style:{whiteSpace:'nowrap'}},h('span',{className:'badge',style:statusBadgeStyle(sn)},sn));})(),
        h('td',{style:{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'var(--text-sm)'}},String(pkItems.length)),

    }

  }else{panel.append(h('div',{className:'empty-panel'},'No unbilled packets — all up to date'));}
  grid.append(panel);
  c.append(grid);return c;
}


function applyRecordFilters(pkts){
  const f=S.recFilters;
  let result=pkts;
  if(!f.showArchived)result=result.filter(r=>statusShowDash(r.status_id));
  if(f.statuses.length)result=result.filter(r=>f.statuses.includes(r.status_id));
  if(f.retailerId)result=result.filter(r=>r.retailer_id===f.retailerId);
  if(f.user!=='all'){
    result=result.filter(r=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===r.id);
      if(!items.length)return false;
      return f.user==='paula'?items.some(i=>(i.paula_pct||0)>0):items.some(i=>(i.gabrielle_pct||0)>0);
    });
  }
  let dr=null;
  if(f.dateRange!=='all'&&f.dateRange!=='custom')dr=getDateRange(f.dateRange);
  else if(f.dateRange==='custom'&&f.dateFrom&&f.dateTo)dr={from:new Date(f.dateFrom),to:new Date(f.dateTo+'T23:59:59')};
  if(dr)result=result.filter(r=>{const d=parseStoredDate(r.date);return d&&d>=dr.from&&d<=dr.to;});
  if(f.search){const s=f.search.toLowerCase();result=result.filter(r=>[r.surname,r.customer_ref,r.date].some(v=>(v||'').toLowerCase().includes(s)));}
  return result;
}

  // Retailer
  const retSel=h('select',{className:'select',style:{width:'150px'}});
  retSel.append(h('option',{value:''},'All Retailers'));
  S.retailers.forEach(r=>{const o=h('option',{value:String(r.id)},r.name);if(f.retailerId===r.id)o.selected=true;retSel.append(o);});
  retSel.addEventListener('change',e=>{f.retailerId=e.target.value?parseInt(e.target.value):null;render();});
  filterRow.append(fld('Retailer',retSel));

  // User
  const userSel=h('select',{className:'select',style:{width:'130px'}});
  [{v:'all',l:'All Users'},{v:'paula',l:'Paula'},{v:'gabby',l:'Gabby'}].forEach(({v,l})=>{const o=h('option',{value:v},l);if(f.user===v)o.selected=true;userSel.append(o);});
  userSel.addEventListener('change',e=>{f.user=e.target.value;render();});
  filterRow.append(fld('User',userSel));

  // Date Range — fixed width select
  const fmtD2=d=>new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short'});
  const drSel=h('select',{className:'select',style:{width:'160px'}});
  [['all','All Dates'],['today','Today'],['week','This Week'],['month','This Month'],['lastmonth','Last Month'],['thisfy','This FY'],['lastfy','Last FY'],['custom','Custom']].forEach(([v,l])=>{
    let label=l;
    if(v==='custom'&&f.dateRange==='custom'&&f.dateFrom&&f.dateTo)label=fmtD2(f.dateFrom)+' – '+fmtD2(f.dateTo);
    const o=h('option',{value:v},label);
    if(f.dateRange===v)o.selected=true;
    drSel.append(o);
  });
  drSel.addEventListener('change',e=>{f.dateRange=e.target.value;if(f.dateRange!=='custom'){f.dateFrom='';f.dateTo='';}render();});

  // Sort — only show when dataset is small enough to be meaningful
  const SORT_THRESHOLD=500;
  if(applyRecordFilters(S.packets).length<=SORT_THRESHOLD){
    const sortSel=h('select',{className:'select',style:{width:'160px'}});
    [['date_desc','Date (newest)'],['date_asc','Date (oldest)'],['surname_asc','Surname (A–Z)'],['surname_desc','Surname (Z–A)']].forEach(([v,l])=>{
      const o=h('option',{value:v},l);if(f.sort===v)o.selected=true;sortSel.append(o);
    });
    sortSel.addEventListener('change',e=>{f.sort=e.target.value;render();});
    filterRow.append(fld('Sort',sortSel));
  }

  filterRow.append(fld('Date Range',drSel));

  const hasF=f.search||f.statuses.length||f.retailerId||f.user!=='all'||f.dateRange!=='all'||f.showArchived;
  const resetBtn=h('button',{className:'btn btn-secondary',style:{alignSelf:'flex-end',flexShrink:'0',width:'80px'},onClick:()=>{
    S.recFilters={search:'',statuses:[],showArchived:false,retailerId:null,user:'all',dateRange:'all',dateFrom:'',dateTo:'',sort:'date_desc'};
    S.selectedPacketIds=new Set();render();
  }},'Reset');
  resetBtn.disabled=!hasF;
  filterRow.append(resetBtn);

  fb.append(filterRow);

  // Custom date row — outside the filter bar, right edge aligned with Date Range select
  // paddingRight offsets by Reset width (80px) + gap (space-4) so dates sit under Date Range
  if(f.dateRange==='custom'){
    const fi=h('input',{type:'date',className:'input',style:{width:'170px'},value:f.dateFrom});
    const ti=h('input',{type:'date',className:'input',style:{width:'170px'},value:f.dateTo});
    fi.addEventListener('input',e=>{f.dateFrom=e.target.value;render();});
    ti.addEventListener('input',e=>{f.dateTo=e.target.value;render();});
    fb.append(h('div',{style:{display:'flex',gap:'var(--space-2)',alignItems:'center',justifyContent:'flex-end',paddingRight:'calc(80px + var(--space-4))'}},
      fi,h('span',{style:{color:'var(--color-muted-foreground)',fontSize:'var(--text-sm)',flexShrink:'0'}},'–'),ti
    ));
  }

  c.append(fb);

  // Batch toolbar
  if(selCount>0){

    bb.append(h('span',{className:'text-para-regular',style:{fontWeight:'var(--font-semibold)',flex:'1'}},selCount+' packet'+(selCount!==1?'s':'')+' selected'));
    const sd=h('select',{className:'select',style:{width:'200px'}});
    sd.append(h('option',{value:''},'Change status to...'));
    S.billingStatuses.forEach(s=>sd.append(h('option',{value:String(s.id)},s.name)));
    const ab=h('button',{className:'btn btn-primary',onClick:async()=>{

      if(!nid){showToast('Select a status first',true);return;}
      ab.disabled=true;ab.textContent='Updating...';
      try{
        for(const pid of S.selectedPacketIds)await sbUpdate('packets',pid,{status_id:nid,modified:fmtD(new Date())});
        S.selectedPacketIds=new Set();
        await loadAll();toast('Status updated');
      }catch(e){showToast('Update failed: '+e.message,true);ab.disabled=false;ab.textContent='Apply';}
    }},'Apply');
    bb.append(sd,ab,h('button',{className:'btn btn-secondary',onClick:()=>{S.selectedPacketIds=new Set();render();}},'Clear'));
    c.append(bb);
  }

  // Empty state
  if(!filtered.length){
    const em=h('div',{className:'empty-state'});em.innerHTML=I.empty;
    em.append(h('p',{className:'empty-state-title'},'No packets match your filters'),h('p',{className:'empty-state-hint'},'Try adjusting the filters above'));

  }

  // Sort
  const sortFns={
    date_desc:(a,b)=>new Date(b.date)-new Date(a.date),
    date_asc:(a,b)=>new Date(a.date)-new Date(b.date),
    surname_asc:(a,b)=>(a.surname||'').localeCompare(b.surname||''),
    surname_desc:(a,b)=>(b.surname||'').localeCompare(a.surname||''),
  };
  filtered.sort(sortFns[f.sort]||sortFns.date_desc);

  // Table
  const panel=h('div',{style:{overflowX:'auto'}});
  const tbl=h('table',{className:'table'});
  const allChk=filtered.length>0&&filtered.every(r=>S.selectedPacketIds.has(r.id));
  const saCb=h('input',{type:'checkbox'});saCb.checked=allChk;
  saCb.addEventListener('change',()=>{filtered.forEach(r=>saCb.checked?S.selectedPacketIds.add(r.id):S.selectedPacketIds.delete(r.id));render();});
  const cHdr=f.user==='paula'?'Paula ($)':f.user==='gabby'?'Gabby ($)':'Total ($)';
  tbl.append(h('thead',{},h('tr',{},
    h('th',{className:'table-header',style:{width:'36px'}},saCb),
    h('th',{className:'table-header'},'Date'),h('th',{className:'table-header'},'Ref'),h('th',{className:'table-header'},'Surname'),
    h('th',{className:'table-header'},'Retailer'),h('th',{className:'table-header'},'Status'),
    h('th',{className:'table-header',style:{textAlign:'right'}},cHdr),
    h('th',{className:'table-header',style:{width:'60px',textAlign:'center'}},'Shipped'),
  )));
  const tb=h('tbody',{});
  for(const r of filtered){
    const costs=packetCosts(r.id);
    const cv=f.user==='paula'?costs.paula:f.user==='gabby'?costs.gabby:costs.total;
    const cb=h('input',{type:'checkbox'});cb.checked=S.selectedPacketIds.has(r.id);
    cb.addEventListener('change',()=>{S.selectedPacketIds[cb.checked?'add':'delete'](r.id);render();});
    cb.addEventListener('click',e=>e.stopPropagation());
    const retName=retailerName(r.retailer_id);
    const bl=packetBillingLabel(r);const sn=bl||statusName(r.status_id);
    const rowClick=e=>{e.stopPropagation();S.editId=r.id;S.view='edit';renderAsync();};
    const trAttrs={style:{cursor:'pointer'},onClick:rowClick};
    if(S.selectedPacketIds.has(r.id))trAttrs.className='table-row-selected';

    if(r.shipping_run_id){shippedCell.innerHTML=I.check;}
    tb.append(h('tr',trAttrs,
      h('td',{style:{width:'36px'}},cb),
      h('td',{},r.date),h('td',{className:'mono'},r.customer_ref),
      h('td',{className:'name-cell'},r.surname),
      h('td',{style:{flex:'1'}},retName),
      h('td',{},h('span',{className:'badge',style:statusBadgeStyle(sn)},sn)),
      h('td',{style:{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'var(--text-sm)'}},fmtMoney(cv)),
      shippedCell,
    ));
  }
  tbl.append(tb);panel.append(tbl);c.append(panel);return c;
}

function renderForm(packet){

  // Guard -- if lookups not loaded yet

        retryBtn,
      )
    );
  }

  // -- PACKET HEADER STATE (hdr) --
  // hdr = mutable packet-level fields shared across all form sections
  const hdr={
    dateISO:packet?dateToISO(packet.date):todayISO(),
    date:packet?packet.date:fmtD(new Date()),
    retailerId:packet?packet.retailer_id:S.retailers[0].id,
    customerRef:packet?packet.customer_ref:'',
    refSuffix:'',
    surname:packet?packet.surname:'',
    subCustomer:packet?packet.sub_customer_id:'',
  };

  const isNJ=()=>{const r=S.retailers.find(x=>x.id===hdr.retailerId);return r&&r.requires_shipping===true;}
  const hasSubCustomers=()=>S.subCustomers.some(sc=>sc.retailer_id===hdr.retailerId);

    id:gid(),

    input.classList.add('error');
    errorEl.textContent = message;
    errorEl.style.display = 'block';

  }

// Get all packet_items matching current billing filters + checked selection
function getBillingItems(){
  const f=S.billing.filters;
  const user=S.user;
  // Filter packets: New status only, current user not yet billed
  let pkts=S.packets.filter(p=>{
    if(p.status_id!==statusId('New'))return false;
    if(user==='paula'&&(p.paula_billed||false))return false;
    if(user==='gabby'&&(p.gabby_billed||false))return false;
    return true;
  });
  // Retailer / sub-customer filter
  if(f.retailerKey){
    const [ridStr,subCust]=f.retailerKey.split(':');
    const rid=parseInt(ridStr);
    pkts=pkts.filter(p=>p.retailer_id===rid);
    if(subCust)pkts=pkts.filter(p=>p.sub_customer_id===subCust);
  }
  // Date range
  let dr=null;
  if(f.dateRange!=='all'&&f.dateRange!=='custom')dr=getDateRange(f.dateRange);
  else if(f.dateRange==='custom'&&f.dateFrom&&f.dateTo)dr={from:new Date(f.dateFrom),to:new Date(f.dateTo+'T23:59:59')};
  if(dr)pkts=pkts.filter(p=>{const d=parseStoredDate(p.date);return d&&d>=dr.from&&d<=dr.to;});
  // Get packet_items for filtered packets, excluding items where user has 0%
  const pktIds=new Set(pkts.map(p=>p.id));
  return S.allPacketItems.filter(i=>{
    if(!pktIds.has(i.packet_id))return false;
    // Gabby always invoices full cost to retailer — include all items regardless of her pct
    if(user==='gabby')return true;
    // Paula invoices Gabby for her share — exclude items where paula has 0%
    const pct=(i.paula_pct||0);
    return pct>0;
  });
}

const INVOICE_GROUPS={'Pearl Threading':'Pearl Threading','Stock Update':'Stock','Stock - New':'Stock'};
function invoiceGroup(jtName){return INVOICE_GROUPS[jtName]||'Valuations';}
function isRetailerCombined(retailerId){const r=S.retailers.find(r=>r.id===retailerId);return !!(r&&r.combined_billing);}

function nextInvoiceNumber(){
  // Use taxInvoices as source of truth once populated; fall back to shippingRuns for pre-migration data
  const source=(S.taxInvoices&&S.taxInvoices.length)?S.taxInvoices:S.shippingRuns;
  let max=0;
  (source||[]).forEach(r=>{
    if(r.invoice_number){
      const m=r.invoice_number.match(/^INV-(\d+)$/);
      if(m)max=Math.max(max,parseInt(m[1],10));
    }
  });
  return'INV-'+(max+1).toString().padStart(4,'0');
}

function nextPackingSlipNumber(){
  let max=0;
  (S.shippingRuns||[]).forEach(r=>{
    if(r.packing_slip_number){
      const m=r.packing_slip_number.match(/^PS-(\d+)$/);
      if(m)max=Math.max(max,parseInt(m[1],10));
    }
  });
  return'PS-'+(max+1).toString().padStart(4,'0');
}

function getShippingForBilling(retailerId){
  // Match shipping runs by retailer + billing date range (not by selected packet IDs,
  // since non-combined retailers may have packets not in the current user's billing selection)
  const bf=S.billing.filters;
  let dr=null;
  if(bf.dateRange!=='all'&&bf.dateRange!=='custom')dr=getDateRange(bf.dateRange);
  else if(bf.dateRange==='custom'&&bf.dateFrom&&bf.dateTo)dr={from:new Date(bf.dateFrom),to:new Date(bf.dateTo+'T23:59:59')};
  const runs=(S.shippingRuns||[]).filter(r=>{
    if(r.retailer_id!==retailerId)return false;
    if(dr&&r.ship_date){const sd=new Date(r.ship_date);if(sd<dr.from||sd>dr.to)return false;}
    return true;
  });
  const bySubCustomer={};
  const bySubCustomerRunCount={};
  let total=0;
  runs.forEach(r=>{
    const cost=parseFloat(r.shipping_cost)||0;
    total+=cost;
    const sc=r.sub_customer_id||'';
    bySubCustomer[sc]=(bySubCustomer[sc]||0)+cost;
    bySubCustomerRunCount[sc]=(bySubCustomerRunCount[sc]||0)+1;
  });
  // Date range label: "01-31 May 2026 (N)" or "01 May-15 Jun 2026 (N)"
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtShipDate=d=>{const[y,m,dy]=d.split('-');return{day:parseInt(dy,10),month:months[parseInt(m,10)-1],year:parseInt(y,10)};};
  const sortedDates=runs.map(r=>r.ship_date).filter(Boolean).sort();
  let dateLabel='';
  if(sortedDates.length){
    const f=fmtShipDate(sortedDates[0]);const l=fmtShipDate(sortedDates[sortedDates.length-1]);
    dateLabel=(f.year===l.year&&f.month===l.month)
      ?f.day+'-'+l.day+' '+f.month+' '+f.year
      :f.day+' '+f.month+'-'+l.day+' '+l.month+' '+l.year;
  }
  const totalExGST=total/1.15;
  const bySubCustomerExGST=Object.fromEntries(Object.entries(bySubCustomer).map(([sc,v])=>[sc,v/1.15]));
  return{total,totalExGST,bySubCustomer,bySubCustomerExGST,bySubCustomerRunCount,runs,runCount:runs.length,dateLabel};
}

function buildInvoiceSummary(items,retailerId){
  const user=S.user;
  const retailer=S.retailers.find(r=>r.id===retailerId);
  const discountPct=retailer?retailer.discount_pct||0:0;
  const discountMult=1-discountPct/100;
  const isNJRetailer=retailer&&retailer.name==='Nationwide Jewellers';
  // All retailers now use unified model: Gabby invoices retailer at full cost, Paula invoices Gabby
  const isCombined=true;
  const isCombinedGabby=user==='gabby';
  const isCombinedPaula=user==='paula';

  // Pre-seed in display order: Valuations first, then Stock, then Pearl Threading
  const byJobType={'Valuations':0,'Stock':0,'Pearl Threading':0};
  const bySubCustomer={};// NJ only: {subCustomer: {jobTypeName: amount}}

  items.forEach(i=>{
    const pkt=S.packets.find(p=>p.id===i.packet_id);
    if(!pkt||pkt.retailer_id!==retailerId)return;
    const cost=(parseFloat(i.cost)||0)*discountMult;
    const pct=isCombinedGabby?1:(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
    const userCost=cost*pct;
    const jt=S.jobTypes.find(j=>j.id===i.job_type_id);
    const jtName=jt?jt.name:'Unknown';
    const grp=invoiceGroup(jtName);
    byJobType[grp]+=userCost;
    if(isNJRetailer){
      const sc=pkt.sub_customer_id||'Unassigned';
      if(!bySubCustomer[sc])bySubCustomer[sc]={};
      if(!bySubCustomer[sc][jtName])bySubCustomer[sc][jtName]=0;
      bySubCustomer[sc][jtName]+=userCost;
    }
  });
  // Remove groups with zero value so they don't appear on the invoice
  Object.keys(byJobType).forEach(k=>{if(byJobType[k]===0)delete byJobType[k];});
  const subtotal=Object.values(byJobType).reduce((a,b)=>a+b,0);
  const gst=subtotal*(getCurrentUser().gst_rate||0)/100;
  const total=subtotal+gst;
  return{byJobType,bySubCustomer,subtotal,gst,total,discountPct,isNJRetailer,isCombined,isCombinedGabby,isCombinedPaula};
}

function stepIndicator(current,total){
  // Shows: Selection > Retailer 1 > ... > Generate > Confirm
  const steps=['Selection',...S.billing.retailers.map((_,i)=>'Retailer '+(i+1)),'Generate','Confirm'];
  const wrap=h('div',{className:'step-indicator'});

    dot.title=label;
    wrap.append(dot);
  });
  return wrap;
}

  const discountMult=1-discountPct/100;
  const isNJRetailer=retailer&&retailer.name==='Nationwide Jewellers';
  const myItems=S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)&&(S.packets.find(p=>p.id===i.packet_id)||{}).retailer_id===retailerId);
  const summary=buildInvoiceSummary(myItems,retailerId);
  const {isCombinedGabby,isCombinedPaula}=summary;
  const pdfShipping=getShippingForBilling(retailerId);
  const now=new Date();

  let lines=[];
  lines.push('PGJ Appraisals, Detailed Report');
  lines.push(isCombinedGabby?pdfRetName:pdfRetName+' -- '+(isCombinedPaula?'Invoice to: Gabby Lovering':displayName));
  lines.push(fmtD(now));
  const bf=S.billing.filters;
  if(bf.dateRange==='all'){lines.push('Period: All dates');}
  else if(bf.dateRange==='custom'&&bf.dateFrom&&bf.dateTo){lines.push('Period: '+bf.dateFrom+' to '+bf.dateTo);}
  else{const dr=getDateRange(bf.dateRange);if(dr)lines.push('Period: '+fmtD(dr.from)+' to '+fmtD(dr.to));}
  // Helper: format one item line
  const fmtItemLine=i=>{
    const pkt=S.packets.find(p=>p.id===i.packet_id)||{};
    const jt=S.jobTypes.find(j=>j.id===i.job_type_id)||{};
    const cost=(parseFloat(i.cost)||0)*discountMult;
    const pct=isCombinedGabby?1:(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
    return isNJRetailer
      ?(pkt.date||'').padEnd(14)+(pkt.customer_ref||'').substring(0,16).padEnd(18)+(scName(pkt.sub_customer_id)||'').substring(0,12).padEnd(14)+(pkt.surname||'').substring(0,12).padEnd(14)+(i.item||'').substring(0,12).padEnd(14)+(jt.name||'').substring(0,16).padEnd(18)+fmtMoney(cost*pct).padStart(8)
      :(pkt.date||'').padEnd(14)+(pkt.customer_ref||'').padEnd(12)+(pkt.surname||'').substring(0,14).padEnd(16)+(i.item||'').substring(0,16).padEnd(18)+(jt.name||'').substring(0,20).padEnd(22)+fmtMoney(cost*pct).padStart(8);
  };
  const fmtItemCost=i=>{
    const cost=(parseFloat(i.cost)||0)*discountMult;
    const pct=isCombinedGabby?1:(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
    return cost*pct;
  };
  const W=isNJRetailer?100:90;
  const hdrCols=isNJRetailer
    ?('Date').padEnd(14)+('Ref').padEnd(18)+('Sub-customer').padEnd(14)+('Surname').padEnd(14)+('Item').padEnd(14)+('Job Type').padEnd(18)+('Cost').padStart(8)
    :('Date').padEnd(14)+('Ref').padEnd(12)+('Surname').padEnd(16)+('Item').padEnd(18)+('Description').padEnd(22)+('Cost').padStart(8);

  // Group items by shipping run (sorted by ship_date then packet date)
  const runMap={};// runId -> {run, items[]}
  const noRunItems=[];
  const sortedRuns=[...pdfShipping.runs].sort((a,b)=>a.ship_date.localeCompare(b.ship_date));
  sortedRuns.forEach(r=>{runMap[r.id]={run:r,items:[]};});
  myItems.forEach(i=>{
    const pkt=S.packets.find(p=>p.id===i.packet_id)||{};
    if(pkt.shipping_run_id&&runMap[pkt.shipping_run_id])runMap[pkt.shipping_run_id].items.push(i);
    else noRunItems.push(i);
  });

  lines.push('');
  lines.push('ITEM DETAILS');
  lines.push('-'.repeat(W));
  lines.push(hdrCols);

  let valuationsTotal=0;
  const shippingTotal=pdfShipping.totalExGST;

  sortedRuns.forEach(run=>{
    const group=runMap[run.id];
    if(!group||!group.items.length)return;
    const shipCost=parseFloat(run.shipping_cost)||0;
    const runLabel=(run.invoice_number?'Invoice: '+run.invoice_number+' ':'Shipment: ')+run.ship_date+(run.tracking_last4?' (tracking ...'+run.tracking_last4+')':'');
    lines.push('-'.repeat(W));
    lines.push(runLabel);
    lines.push('-'.repeat(W));
    let runItemsTotal=0;
    group.items.forEach(i=>{
      lines.push(fmtItemLine(i));
      runItemsTotal+=fmtItemCost(i);
    });
    valuationsTotal+=runItemsTotal;
    const shipCostExGST=shipCost/1.15;
    lines.push('');
    lines.push('Shipping'.padEnd(W-10)+fmtMoney(shipCostExGST).padStart(10));
    lines.push('Run Subtotal'.padEnd(W-10)+fmtMoney(runItemsTotal+shipCostExGST).padStart(10));
  });

  // Unshipped items (if any)
  if(noRunItems.length){
    lines.push('-'.repeat(W));
    lines.push('Unshipped items');
    lines.push('-'.repeat(W));
    noRunItems.forEach(i=>{
      lines.push(fmtItemLine(i));
      valuationsTotal+=fmtItemCost(i);
    });
  }

  lines.push('-'.repeat(W));
  lines.push('');
  lines.push('SUMMARY');
  lines.push('-'.repeat(40));

  if(isNJRetailer&&discountPct>0){
    const grossSubtotal=valuationsTotal/discountMult;
    const discountAmt=grossSubtotal-valuationsTotal;
    lines.push('Valuations (before discount)'.padEnd(30)+fmtMoney(grossSubtotal).padStart(10));
    lines.push(('Discount ('+discountPct+'%)').padEnd(30)+('-'+fmtMoney(discountAmt)).padStart(10));
  }
  lines.push('Valuations Subtotal'.padEnd(30)+fmtMoney(valuationsTotal).padStart(10));
  if(shippingTotal>0){
    lines.push('Shipping Subtotal'.padEnd(30)+fmtMoney(shippingTotal).padStart(10));
  }
  lines.push('-'.repeat(40));
  const cu=getCurrentUser();
  const gstBase=valuationsTotal+shippingTotal;
  if(cu.gst_registered){
    lines.push(('GST ('+cu.gst_rate+'%)').padEnd(30)+fmtMoney(gstBase*(cu.gst_rate/100)).padStart(10));
  }
  const totalAmt=cu.gst_registered?gstBase*(1+cu.gst_rate/100):gstBase;
  lines.push('TOTAL'.padEnd(30)+fmtMoney(totalAmt).padStart(10));
  lines.push('');
  lines.push('Total items: '+myItems.length);
  return lines.join('\n');
}

function downloadTextAsPDF(text, filename){
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const lines=text.split('\n');
  let y=15;
  lines.forEach(line=>{
    if(y>275){doc.addPage();y=15;}
    const size=line.startsWith('PGJ')?13:line.startsWith('-')?8:9;
    const bold=line.startsWith('PGJ')||line.startsWith('SUMMARY')||line.startsWith('ITEM')||line.startsWith('TOTAL')||line.startsWith('Subtotal');
    doc.setFontSize(size);
    doc.setFont('courier',bold?'bold':'normal');
    doc.text(line,10,y);
    y+=size===13?7:4.5;
  });
  doc.save(filename);
}

function renderBillingStep4(){
  const b=S.billing;
  const user=S.user;
  const displayName=user==='paula'?'Paula':'Gabby';

  // Count packets (not items) involved
  const pktIds=new Set(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)).map(i=>i.packet_id));

  const c=h('div',{});

  ));

  const card=h('div',{className:'panel',style:{maxWidth:'560px',margin:'0 auto'}});
  const body=h('div',{style:{padding:'24px 28px'}});

  body.append(h('p',{style:{fontSize:'15px',color:'var(--color-foreground)',marginBottom:'20px'}},
    'You are about to mark ',h('strong',{},String(pktIds.size)+' packet'+(pktIds.size!==1?'s':'')),
    ' as ',h('strong',{},'Billed'),' for ',h('strong',{},displayName),'.'));

  // Retailer breakdown
  b.retailers.forEach(rid=>{
    const retName=retailerName(rid);
    const retPktIds=new Set(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)&&(S.packets.find(p=>p.id===i.packet_id)||{}).retailer_id===rid).map(i=>i.packet_id));
    const summary=buildInvoiceSummary(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)),rid);
    body.append(h('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--color-border-light)'}},
      h('span',{style:{fontWeight:'600'}},retName),
      h('span',{style:{color:'var(--color-muted-foreground)'}},retPktIds.size+' packets  -  '+fmtMoney(summary.total)),
    ));
  });

  body.append(h('p',{style:{fontSize:'13px',color:'var(--color-muted-foreground)',marginTop:'16px'}},'This action cannot be undone. Ensure you have copied the invoice details and downloaded the PDF reports before confirming.'));
  card.append(body);

  const confirmBtn=h('button',{className:'btn btn-primary',onClick:async()=>{
    confirmBtn.disabled=true;confirmBtn.textContent='Updating...';
    try{
      const now=fmtD(new Date());
      const billedCol=user==='paula'?'paula_billed':'gabby_billed';
      const billedStatusId=statusId('Billed');
      for(const pid of pktIds){
        const pkt=S.packets.find(p=>p.id===pid)||{};
        const otherBilled=user==='paula'?(pkt.gabby_billed||false):(pkt.paula_billed||false);
        const otherHasNoWork=user==='paula'
          ?S.allPacketItems.filter(i=>i.packet_id===pid).every(i=>(i.gabrielle_pct||0)===0)
          :S.allPacketItems.filter(i=>i.packet_id===pid).every(i=>(i.paula_pct||0)===0);
        const updateData={[billedCol]:true,modified:now};
        if(otherBilled||otherHasNoWork){updateData.status_id=billedStatusId;}
        await sbUpdate('packets',pid,updateData);
      }
      // Save billing run record
      const runId=gid();
      await sbInsert('billing_runs',{
        id:runId,run_date:fmtD(new Date()),user_name:user,
        retailer_ids:b.retailers.join(','),
        packet_ids:[...pktIds].join(','),
        status:'completed',created:now,
      });
      await loadAll();
      b.step=0;S.view='reports';
      toast('Billing complete -- '+pktIds.size+' packets marked as Billed for '+(user==='paula'?'Paula':'Gabby'));
    }catch(e){showToast('Error: '+e.message,true);confirmBtn.disabled=false;confirmBtn.textContent='Confirm + Mark as Billed';}
  }},'Confirm + Mark as Billed');

  const foot=h('div',{style:{display:'flex',justifyContent:'space-between',padding:'16px 28px',borderTop:'1px solid var(--color-border)'}});
  foot.append(
    h('button',{className:'btn btn-secondary',onClick:()=>{b.step=3;render();}},ic('back'),'Back'),
    h('div',{style:{display:'flex',gap:'10px'}},
      h('button',{className:'btn btn-secondary',onClick:()=>{S.view='home';b.step=0;render();}},'Cancel'),
      confirmBtn,
    ),
  );
  card.append(foot);
  c.append(card);
  return c;
}

  [['month','This Month'],['lastmonth','Last Month'],['thisfy','This FY'],['lastfy','Last FY'],['custom','Custom']].forEach(([v,l])=>{
    const o=h('option',{value:v},l);
    if(cr.dateRange===v)o.selected=true;
    drSel.append(o);
  });
  drSel.addEventListener('change',e=>{cr.dateRange=e.target.value;if(cr.dateRange!=='custom'){cr.dateFrom='';cr.dateTo='';}render();});
  drWrap.append(drSel);
  if(cr.dateRange==='custom'){
    const fi=h('input',{type:'date',className:'input',style:{width:'170px'},value:cr.dateFrom});
    const ti=h('input',{type:'date',className:'input',style:{width:'170px'},value:cr.dateTo});
    fi.addEventListener('input',e=>{cr.dateFrom=e.target.value;render();});
    ti.addEventListener('input',e=>{cr.dateTo=e.target.value;render();});
    drWrap.append(fi,h('span',{style:{color:'var(--color-muted-foreground)',fontSize:'var(--text-sm)',flexShrink:'0'}},'–'),ti);
  }
  filterRow.append(fld('Date Range',drWrap));

  // Retailer
  const retSel=h('select',{className:'select',style:{width:'160px'}});
  retSel.append(h('option',{value:''},'All Retailers'));
  S.retailers.forEach(r=>{
    const o=h('option',{value:String(r.id)},r.name);
    if(cr.retailerId===r.id)o.selected=true;
    retSel.append(o);
  });
  retSel.addEventListener('change',e=>{cr.retailerId=e.target.value?parseInt(e.target.value):null;render();});
  filterRow.append(fld('Retailer',retSel));

  fb.append(filterRow);
  c.append(fb);

  // Compute filtered data (must be before dlBtn so closure captures correct reference)
  let dr=null;
  if(cr.dateRange!=='custom')dr=getDateRange(cr.dateRange);
  else if(cr.dateFrom&&cr.dateTo)dr={from:new Date(cr.dateFrom),to:new Date(cr.dateTo+'T23:59:59')};

  let filteredPackets=S.packets.filter(p=>{
    if(cr.retailerId&&p.retailer_id!==cr.retailerId)return false;
    if(dr){const d=parseStoredDate(p.date);if(!d||d<dr.from||d>dr.to)return false;}
    return true;
  });
  filteredPackets.sort((a,b)=>{
    if(a.retailer_id!==b.retailer_id)return a.retailer_id-b.retailer_id;
    return (a.customer_ref||'').localeCompare(b.customer_ref||'');
  });

  if(!filteredPackets.length){
    const em=h('div',{className:'empty-state'});
    em.append(h('p',{className:'empty-state-title'},'No packets match the selected filters'),h('p',{className:'empty-state-hint'},'Try adjusting the filters above'));
    c.append(em);
    return c;
  }

  // Group by retailer
  const byRetailer={};
  filteredPackets.forEach(p=>{
    const rid=p.retailer_id;
    if(!byRetailer[rid])byRetailer[rid]=[];
    byRetailer[rid].push(p);
  });

  Object.entries(byRetailer).forEach(([rid,pkts])=>{
    const retName=retailerName(parseInt(rid));
    const section=h('div',{className:'panel',style:{marginBottom:'var(--space-5)'}});

    section.append(h('div',{className:'panel-header',style:{padding:'var(--space-4)',alignItems:'center'}},
      h('span',{className:'h2',style:{marginBottom:'0'}},retName),
      h('span',{style:{fontSize:'var(--text-sm)',color:'var(--color-secondary-foreground)'}},pkts.length+' packet'+(pkts.length!==1?'s':'')),
    ));

    const tbl=h('table',{className:'table'});
    tbl.append(h('thead',{},h('tr',{},
      h('th',{className:'table-header'},'Ref'),
      h('th',{className:'table-header'},'Surname'),
      h('th',{className:'table-header'},'Item'),
      h('th',{className:'table-header'},'Job Type'),
      h('th',{className:'table-header',style:{textAlign:'right'}},'Cost'),
    )));
    const tb=h('tbody',{});

    let retailerTotal=0;let retailerItemCount=0;
    pkts.forEach(pkt=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
      items.forEach((item,idx)=>{
        const jt=S.jobTypes.find(j=>j.id===item.job_type_id)||{};
        const cost=parseFloat(item.cost)||0;
        retailerTotal+=cost;retailerItemCount++;
        tb.append(h('tr',{},
          h('td',{className:'mono'},idx===0?pkt.customer_ref:''),
          h('td',{},idx===0?pkt.surname:''),
          h('td',{},item.item||''),
          h('td',{},jt.name||''),
          h('td',{style:{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'var(--text-sm)'}},fmtMoney(cost)),
        ));
      });
      if(!items.length){
        tb.append(h('tr',{},
          h('td',{className:'mono'},pkt.customer_ref),
          h('td',{},pkt.surname),
          h('td',{colspan:'3',style:{color:'var(--color-muted-foreground)',fontSize:'var(--text-xs)'}},'No items'),
        ));
      }
    });

    tb.append(h('tr',{style:{fontWeight:'var(--font-semibold)',borderTop:'2px solid var(--color-border-light)'}},
      h('td',{colspan:'4',style:{padding:'var(--space-5) var(--space-4)'}},'Total items: '+retailerItemCount),
      h('td',{style:{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'var(--text-sm)',padding:'var(--space-5) var(--space-4)'}},fmtMoney(retailerTotal)),
    ));

    tbl.append(tb);section.append(tbl);c.append(section);
  });

  // Download PDF — primary button at bottom of page
  c.append(h('div',{style:{display:'flex',justifyContent:'flex-end',paddingTop:'var(--space-4)'}},
    h('button',{className:'btn btn-primary',onClick:()=>downloadCustomerReportPDF(filteredPackets,cr)},ic('download'),'Download PDF'),
  ));

  return c;
}

function downloadCustomerReportPDF(filteredPackets,cr){
  if(!filteredPackets||!filteredPackets.length){showToast('No data to export',true);return;}
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  let y=15;

  // Helper to add page if needed
  const checkPage=()=>{if(y>270){doc.addPage();y=15;}};

  // Title
  doc.setFontSize(14);doc.setFont('helvetica','bold');
  doc.text('Customer Report',10,y);y+=7;
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text('Generated: '+fmtD(now),10,y);y+=5;
  if(cr.dateRange!=='custom'){
    const dr=getDateRange(cr.dateRange);
    if(dr)doc.text('Period: '+fmtD(dr.from)+' to '+fmtD(dr.to),10,y);
  } else if(cr.dateFrom&&cr.dateTo){
    doc.text('Period: '+cr.dateFrom+' to '+cr.dateTo,10,y);
  }
  y+=8;

  // Group by retailer
  const byRetailer={};
  filteredPackets.forEach(p=>{
    const rid=p.retailer_id;
    if(!byRetailer[rid])byRetailer[rid]=[];
    byRetailer[rid].push(p);
  });

  Object.entries(byRetailer).forEach(([rid,pkts])=>{
    checkPage();
    const retName=retailerName(parseInt(rid));
    doc.setFontSize(12);doc.setFont('helvetica','bold');
    doc.text(retName,10,y);y+=2;
    doc.setLineWidth(0.3);doc.line(10,y,200,y);y+=5;

    // Column headers
    doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('Ref',10,y);doc.text('Surname',40,y);doc.text('Item',80,y);doc.text('Job Type',120,y);doc.text('Cost',185,y);
    y+=4;doc.line(10,y,200,y);y+=4;

    let retailerTotal=0;let retailerItemCount=0;
    pkts.forEach(pkt=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
      items.forEach((item,idx)=>{
        checkPage();
        const jt=S.jobTypes.find(j=>j.id===item.job_type_id)||{};
        const cost=parseFloat(item.cost)||0;
        retailerTotal+=cost;retailerItemCount++;
        doc.setFontSize(9);doc.setFont('courier','normal');
        doc.text(idx===0?(pkt.customer_ref||''):'',10,y);
        doc.setFont('helvetica','normal');
        doc.text(idx===0?(pkt.surname||''):'',40,y);
        doc.text((item.item||'').substring(0,18),80,y);
        doc.text((jt.name||'').substring(0,20),120,y);
        doc.text(fmtMoney(cost),185,y,{align:'right'});
        y+=5;
      });
      if(!items.length){
        checkPage();
        doc.setFontSize(9);doc.setFont('courier','normal');
        doc.text(pkt.customer_ref||'',10,y);
        doc.setFont('helvetica','normal');
        doc.text(pkt.surname||'',40,y);
        doc.text('No items',80,y);
        y+=5;
      }
    });

    // Retailer totals
    checkPage();
    doc.line(10,y,200,y);y+=4;
    doc.setFontSize(10);doc.setFont('helvetica','bold');
    doc.text('Total items: '+retailerItemCount,10,y);
    doc.text(fmtMoney(retailerTotal),185,y,{align:'right'});
    y+=10;
  });

  const fname='customer_report_'+new Date().toISOString().slice(0,10)+'.pdf';
  doc.save(fname);
}

function renderShipping(){
  const c=h('div',{});
  const sf=S.shippingFilters;

  // Retailers that require shipping
  const shippableRetailerIds=new Set(S.retailers.filter(r=>r.requires_shipping).map(r=>r.id));

  // Archived status id
  const archivedId=S.billingStatuses.find(s=>s.name==='Archived')?.id;

  // Unshipped packets: retailer requires shipping, not archived, no shipping_run_id
  const allUnshipped=S.packets.filter(p=>
    shippableRetailerIds.has(p.retailer_id)&&
    p.status_id!==archivedId&&
    !p.shipping_run_id
  );

  // Apply filter
  const filtered=allUnshipped.filter(p=>{
    if(sf.retailerId&&p.retailer_id!==sf.retailerId)return false;
    if(sf.subCustomer&&p.sub_customer_id!==sf.subCustomer)return false;
    return true;
  });

  // sel must be read after any mutations; selCount drives CTA visibility
  const sel=S.shippingSelected;
  const selCount=sel.size;

  // Page header
  c.append(h('div',{className:'page-header'},
    h('h1',{className:'h1'},'Shipping'),
  ));

  // Filter bar
  const fb=h('div',{style:{borderRadius:'var(--radius-3xl)',padding:'var(--space-5) 0',marginBottom:'var(--space-4)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}});
  const filterRow=h('div',{style:{display:'flex',gap:'var(--space-4)',alignItems:'flex-end'}});

  // Retailer/sub-customer dropdown (labeled Retailer in UI)
  const retDrop=h('select',{className:'select',style:{width:'220px'}});
  retDrop.append(h('option',{value:''},'All Retailers'));
  // Group sub-customers by retailer
  S.retailers.filter(r=>r.requires_shipping).forEach(r=>{
    const scs=S.subCustomers.filter(sc=>sc.retailer_id===r.id);
    if(scs.length){
      const grp=h('optgroup',{label:r.name});
      scs.forEach(sc=>{
        const val=r.id+'|'+sc.id;
        const o=h('option',{value:val},sc.name);
        if(sf.retailerId===r.id&&sf.subCustomer===sc.id)o.selected=true;
        grp.append(o);
      });
      retDrop.append(grp);
    } else {
      const val=r.id+'|';
      const o=h('option',{value:val},r.name);
      if(sf.retailerId===r.id&&!sf.subCustomer)o.selected=true;
      retDrop.append(o);
    }
  });
  retDrop.addEventListener('change',e=>{
    const v=e.target.value;
    if(!v){sf.retailerId=null;sf.subCustomer='';S.shippingSelected=new Set();}
    else{
      const [rid,sc]=v.split('|');
      sf.retailerId=parseInt(rid);sf.subCustomer=sc||'';
      // Auto-select all packets matching the new filter
      S.shippingSelected=new Set(allUnshipped.filter(p=>
        p.retailer_id===sf.retailerId&&(!sf.subCustomer||p.sub_customer_id===sf.subCustomer)
      ).map(p=>p.id));
    }
    render();
  });
  filterRow.append(fld('Retailer',retDrop));

  // Reset
  const hasF=sf.retailerId||sf.subCustomer;
  const resetBtn=h('button',{className:'btn btn-secondary',style:{alignSelf:'flex-end',flexShrink:'0',width:'80px'},onClick:()=>{
    S.shippingFilters={retailerId:null,subCustomer:''};S.shippingSelected=new Set();render();
  }},'Reset');
  resetBtn.disabled=!hasF;
  filterRow.append(resetBtn);
  fb.append(filterRow);
  c.append(fb);


  // Empty state
  if(filtered.length===0){
    const em=h('div',{className:'empty-state'});em.innerHTML=I.inbox;
    em.append(
      h('p',{className:'empty-state-title'},hasF?'No unshipped packets match your filters':'No unshipped packets'),
      h('p',{className:'empty-state-hint'},hasF?'Try adjusting the filter above':'All packets have been shipped'),
    );
    c.append(em);
    return c;
  }

  // Table
  const allChk=h('input',{type:'checkbox'});
  const allSelected=filtered.length>0&&filtered.every(p=>sel.has(p.id));
  allChk.checked=allSelected;
  allChk.addEventListener('change',e=>{
    e.stopPropagation();
    filtered.forEach(p=>e.target.checked?sel.add(p.id):sel.delete(p.id));
    render();
  });

  const tbl=h('table',{className:'table'});
  tbl.append(h('thead',{},h('tr',{className:'table-header'},
    h('th',{className:'table-header',style:{width:'36px'}},allChk),
    h('th',{className:'table-header'},'Date'),
    h('th',{className:'table-header'},'Ref'),
    h('th',{className:'table-header'},'Surname'),
    h('th',{className:'table-header'},'Retailer'),
    h('th',{className:'table-header',style:{textAlign:'right'}},'Items'),
  )));
  const tbody=h('tbody',{});
  filtered.forEach(p=>{
    const cb=h('input',{type:'checkbox'});cb.checked=sel.has(p.id);
    cb.addEventListener('change',e=>{e.stopPropagation();e.target.checked?sel.add(p.id):sel.delete(p.id);render();});
    const itemCount=S.allPacketItems.filter(i=>i.packet_id===p.id).length;
    const retailerLabel=scName(p.sub_customer_id)||S.retailers.find(r=>r.id===p.retailer_id)?.name||'';
    const row=h('tr',{style:{cursor:'pointer'},onClick:()=>{sel.has(p.id)?sel.delete(p.id):sel.add(p.id);render();}},
      h('td',{onClick:e=>e.stopPropagation()},cb),
      h('td',{},p.date),
      h('td',{},p.customer_ref),
      h('td',{},p.surname),
      h('td',{},retailerLabel),
      h('td',{style:{textAlign:'right'}},String(itemCount)),
    );
    tbody.append(row);
  });
  tbl.append(tbody);
  c.append(tbl);

  // Bottom action bar — always visible when packets exist
  const bar=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:'var(--space-5)',paddingTop:'var(--space-4)',borderTop:'1px solid var(--color-border)'}});
  bar.append(
    h('span',{style:{fontSize:'var(--text-sm)',color:'var(--color-muted-foreground)'}},selCount+' of '+filtered.length+' packet'+(filtered.length>1?'s':'')+' selected'),
    (()=>{const b=h('button',{className:'btn btn-primary'},'Create Shipment');b.disabled=selCount===0;b.addEventListener('click',()=>openShipmentModal(filtered));return b;})()
  );
  c.append(bar);
  return c;
}

function openShipmentModal(filteredPackets){
  const sel=S.shippingSelected;
  const selectedPackets=filteredPackets.filter(p=>sel.has(p.id));
  if(!selectedPackets.length)return;

  const firstPacket=selectedPackets[0];
  const retailer=S.retailers.find(r=>r.id===firstPacket.retailer_id);
  const isNJ=retailer?.name==='Nationwide Jewellers';
  const subCustId=firstPacket.sub_customer_id||'';
  const subCust=scName(subCustId);
  const subtitle=(retailer?.name||'')+(subCust?' — '+subCust:'')+'  ·  '+selectedPackets.length+' packet'+(selectedPackets.length>1?'s':'');
  const discountMult=1-((retailer?.discount_pct)||0)/100;

  let shipDate=todayISO();
  let shipCost='6';
  let trackLast4='';
  let saving=false;
  let step=1;
  let invoiceNum=null;
  let psNumber=null;

  const fmt=fmtMoney;

  function getPacketRows(){
    return selectedPackets.map(p=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===p.id);
      const amount=items.reduce((s,i)=>(s+(parseFloat(i.cost)||0)),0);
      return{ref:p.customer_ref,surname:p.surname,itemCount:items.length,amount};
    });
  }

  function doPrintPackingSlip(){if(!psNumber)psNumber=nextPackingSlipNumber();printPackingSlip(selectedPackets,firstPacket.retailer_id,subCust,shipDate,shipCost,psNumber);}
  function doPrintInvoice(){printInvoice(selectedPackets,firstPacket.retailer_id,subCust,invoiceNum,shipDate,shipCost,subCustId);}

  function closeModal(){
    document.querySelector('.shipment-modal-overlay')?.remove();
  }

  function buildModal(){
    closeModal();
    const overlay=document.createElement('div');
    overlay.className='modal-overlay shipment-modal-overlay';
    overlay.style.alignItems='center';
    overlay.addEventListener('click',e=>{if(e.target===overlay&&!saving)closeModal();});

    const modal=h('div',{className:'modal',style:{maxWidth:'560px'}});

    const hdrEl=h('div',{className:'modal-header'});
    hdrEl.append(
      h('div',{},
        h('div',{className:'modal-title'},step===1?'Packing Slip':'Confirm Shipment'),
        h('div',{className:'modal-subtitle'},subtitle),
      ),
      h('div',{style:{fontSize:'var(--text-xs)',color:'var(--color-muted-foreground)',whiteSpace:'nowrap'}},step+' of 2'),
    );
    modal.append(hdrEl);

    const body=h('div',{className:'modal-body'});

    if(step===1){
      // Packet table with amounts
      const rows=getPacketRows();
      const packetsTotal=rows.reduce((s,r)=>s+r.amount,0);

      const pktTbl=h('table',{className:'table'});
      pktTbl.append(h('thead',{},h('tr',{},
        h('th',{className:'table-header'},'Reference'),
        h('th',{className:'table-header'},'Customer'),
        h('th',{className:'table-header',style:{textAlign:'right'}},'Amount'),
      )));
      const ptbody=h('tbody',{});
      rows.forEach(r=>{
        ptbody.append(h('tr',{},
          h('td',{},r.ref),
          h('td',{},(r.surname||'')+' ('+r.itemCount+')'),
          h('td',{style:{textAlign:'right'}},fmt(r.amount)),
        ));
      });
      pktTbl.append(ptbody);
      body.append(pktTbl);

      // Shipping cost field + totals
      const totalsWrap=h('div',{style:{marginTop:'var(--space-4)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}});

      const costRow=h('div',{style:{display:'flex',alignItems:'center',gap:'var(--space-3)'}});
      const costWrap=h('div',{style:{position:'relative',width:'140px'}});
      const costSym=h('span',{style:{position:'absolute',left:'var(--space-3)',top:'50%',transform:'translateY(-50%)',color:'var(--color-muted-foreground)',pointerEvents:'none',fontSize:'var(--text-sm)'}},'$');
      const costIn=h('input',{type:'number',className:'input',style:{paddingLeft:'var(--space-6)'},min:'0',step:'0.01',placeholder:'99.99'});
      costIn.value=shipCost;
      costIn.addEventListener('input',e=>{shipCost=e.target.value;updateTotals();});
      costWrap.append(costSym,costIn);
      costRow.append(fld('Shipping Cost',costWrap));
      totalsWrap.append(costRow);

      const cu=getCurrentUser();
      const gstRate=cu.gst_registered?(cu.gst_rate||15)/100:0;
      function calcTotals(){
        const grossShip=parseFloat(shipCost)||0;
        const netShip=grossShip/1.15;
        const subtotal=packetsTotal+netShip;
        const gst=subtotal*gstRate;
        return{netShip,subtotal,gst,total:subtotal+gst};
      }
      const t0=calcTotals();

      const totalsGrid=h('div',{style:{display:'flex',flexDirection:'column',gap:'var(--space-1)',fontSize:'var(--text-sm)',color:'var(--color-muted-foreground)'}});
      const shippingRow=h('div',{style:{display:'flex',justifyContent:'space-between'}},h('span',{},'Shipping'),h('span',{id:'slip-shipping-val'},fmt(t0.netShip)));
      const subtotalRow=h('div',{style:{display:'flex',justifyContent:'space-between'}},h('span',{},'Subtotal'),h('span',{id:'slip-subtotal-val'},fmt(t0.subtotal)));
      const divEl=h('div',{style:{borderTop:'1px solid var(--color-border)',margin:'var(--space-1) 0'}});
      const totalRow=h('div',{style:{display:'flex',justifyContent:'space-between',fontWeight:'var(--font-semibold)',color:'var(--color-foreground)'}},h('span',{},'Total'),h('span',{id:'slip-total-val'},fmt(t0.total)));
      totalsGrid.append(shippingRow,subtotalRow);
      if(cu.gst_registered){
        const gstRow=h('div',{style:{display:'flex',justifyContent:'space-between'}},h('span',{},'GST ('+cu.gst_rate+'%)'),h('span',{id:'slip-gst-val'},fmt(t0.gst)));
        totalsGrid.append(gstRow);
      }
      totalsGrid.append(divEl,totalRow);
      totalsWrap.append(totalsGrid);
      body.append(totalsWrap);

      function updateTotals(){
        const t=calcTotals();
        const svEl=document.getElementById('slip-shipping-val');
        const stEl=document.getElementById('slip-subtotal-val');
        const gvEl=document.getElementById('slip-gst-val');
        const tvEl=document.getElementById('slip-total-val');
        if(svEl)svEl.textContent=fmt(t.netShip);
        if(stEl)stEl.textContent=fmt(t.subtotal);
        if(gvEl)gvEl.textContent=fmt(t.gst);
        if(tvEl)tvEl.textContent=fmt(t.total);
      }

      modal.append(body);

      const foot=h('div',{className:'modal-footer'});
      const cancelBtn=document.createElement('button');
      cancelBtn.className='btn btn-secondary';
      cancelBtn.textContent='Cancel';
      cancelBtn.addEventListener('click',closeModal);
      const printBtn=document.createElement('button');
      printBtn.className='btn btn-primary';
      printBtn.textContent=isNJ?'Print Invoice':'Print Packing Slip';
      printBtn.addEventListener('click',()=>{
        if(isNJ){if(!invoiceNum)invoiceNum=nextInvoiceNumber();try{doPrintInvoice();}catch(e){console.warn('Print failed:',e);}}
        else{try{doPrintPackingSlip();}catch(e){console.warn('Print failed:',e);}}
        step=2;buildModal();
      });
      foot.append(cancelBtn,h('div',{className:'modal-footer-right'},printBtn));
      modal.append(foot);

    } else {
      // Step 2: date + tracking
      const reprintLink=document.createElement('button');
      reprintLink.className='btn-link';
      reprintLink.style.cssText='font-size:var(--text-sm);margin-bottom:var(--space-4);display:block;';
      reprintLink.textContent=isNJ?'Reprint invoice':'Reprint packing slip';
      reprintLink.addEventListener('click',()=>{
        if(isNJ){try{doPrintInvoice();}catch(e){console.warn('Print failed:',e);}}
        else{try{doPrintPackingSlip();}catch(e){console.warn('Print failed:',e);}}
      });
      body.append(reprintLink);
      const fieldsGrid=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--space-4)',marginBottom:'var(--space-4)'}});

      const dateIn=h('input',{type:'date',className:'input'});
      dateIn.value=shipDate;
      dateIn.addEventListener('input',e=>{shipDate=e.target.value;});
      fieldsGrid.append(fld('Ship Date',dateIn));

      const trackIn=h('input',{type:'text',className:'input',placeholder:'0000',inputMode:'numeric'});
      trackIn.value=trackLast4;
      trackIn.setAttribute('maxlength','4');
      trackIn.addEventListener('input',e=>{trackLast4=e.target.value.replace(/\D/g,'').slice(0,4);trackIn.value=trackLast4;});
      fieldsGrid.append(fld('Tracking (last 4)',trackIn));

      body.append(fieldsGrid);
      modal.append(body);

      const errEl=h('div',{style:{color:'var(--color-destructive)',fontSize:'var(--text-sm)',padding:'0 var(--space-5)',minHeight:'var(--space-4)'}});
      modal.append(errEl);

      const foot=h('div',{className:'modal-footer'});
      const backBtn=document.createElement('button');
      backBtn.className='btn btn-secondary';
      backBtn.textContent='Back';
      backBtn.addEventListener('click',()=>{step=1;buildModal();});
      const shipBtn=document.createElement('button');
      shipBtn.className='btn btn-primary';
      shipBtn.textContent='Mark as Shipped';
      shipBtn.addEventListener('click',async()=>{
        errEl.textContent='';
        if(!shipDate){errEl.textContent='Date is required.';return;}
        if(!trackLast4||trackLast4.length<4){errEl.textContent='Enter the last 4 digits of the tracking number.';return;}
        const cost=parseFloat(shipCost);
        if(isNaN(cost)||cost<0){errEl.textContent='Enter a valid shipping cost.';return;}
        saving=true;shipBtn.textContent='Saving...';shipBtn.disabled=true;backBtn.disabled=true;
        try{
          const runId=gid();
          const runData={id:runId,ship_date:shipDate,shipping_cost:cost,tracking_last4:trackLast4,retailer_id:firstPacket.retailer_id,sub_customer_name:subCust||null,sub_customer_id:subCustId||null,created:todayISO()};
          if(isNJ&&invoiceNum)runData.invoice_number=invoiceNum;
          if(!isNJ&&psNumber)runData.packing_slip_number=psNumber;
          await sbInsert('shipping_runs',runData);
          if(isNJ&&invoiceNum){
            try{await sbInsert('tax_invoices',{id:gid(),invoice_number:invoiceNum,shipping_run_id:runId,issue_date:shipDate,retailer_id:firstPacket.retailer_id,sub_customer_name:subCust||null,sub_customer_id:subCustId||null,status:'active',created:todayISO()});}
            catch(e2){console.warn('tax_invoices insert failed:',e2);}
          }
          for(const p of selectedPackets){await sbUpdate('packets',p.id,{shipping_run_id:runId});}
          S.packets=await sbAll('packets','&order=created.desc')||S.packets;
          try{S.shippingRuns=await sbAll('shipping_runs','&order=created.desc')||S.shippingRuns;}catch(e2){console.warn(e2);}
          try{S.taxInvoices=await sbAll('tax_invoices','&order=created.desc')||S.taxInvoices;}catch(e2){console.warn(e2);}
          S.shippingSelected=new Set();
          closeModal();
          showToast('Shipment recorded');
          render();
        }catch(e){
          errEl.textContent='Error: '+e.message;
          saving=false;shipBtn.textContent='Mark as Shipped';shipBtn.disabled=false;backBtn.disabled=false;
        }
      });
      foot.append(backBtn,h('div',{className:'modal-footer-right'},shipBtn));
      modal.append(foot);
      setTimeout(()=>dateIn.focus(),50);
    }

    overlay.append(modal);
    document.body.append(overlay);
  }
  buildModal();
}

  filterRow.append(fld('Sub-customer',scSel));

  const drSel=h('select',{className:'select',style:{width:'160px'}});
  [['month','This Month'],['lastmonth','Last Month'],['thisfy','This FY'],['lastfy','Last FY'],['custom','Custom']].forEach(([v,l])=>{
    let label=l;
    if(v==='custom'&&sr.dateRange==='custom'&&sr.dateFrom&&sr.dateTo)label=fmtD2(sr.dateFrom)+' – '+fmtD2(sr.dateTo);
    const o=h('option',{value:v},label);
    if(sr.dateRange===v)o.selected=true;
    drSel.append(o);
  });
  drSel.addEventListener('change',e=>{sr.dateRange=e.target.value;if(sr.dateRange!=='custom'){sr.dateFrom='';sr.dateTo='';}render();});
  filterRow.append(fld('Date Range',drSel));

  if(sr.dateRange==='custom'){
    const fi=h('input',{type:'date',className:'input',style:{width:'150px'}});fi.value=sr.dateFrom;
    const ti=h('input',{type:'date',className:'input',style:{width:'150px'}});ti.value=sr.dateTo;
    fi.addEventListener('input',e=>{sr.dateFrom=e.target.value;render();});
    ti.addEventListener('input',e=>{sr.dateTo=e.target.value;render();});
    filterRow.append(
      fld('From',fi),
      fld('To',ti),
    );
  }
  fb.append(filterRow);
  c.append(fb);

  // Date range filter using same logic as filterShippingRuns
  let dr=null;
  if(sr.dateRange!=='custom')dr=getDateRange(sr.dateRange);
  else if(sr.dateFrom&&sr.dateTo)dr={from:new Date(sr.dateFrom),to:new Date(sr.dateTo+'T23:59:59')};

  const invoices=(S.taxInvoices||[]).filter(inv=>{
    if(S.taxInvoicesSubCustomer&&inv.sub_customer_id!==S.taxInvoicesSubCustomer)return false;
    if(dr&&inv.issue_date){const d=new Date(inv.issue_date);if(d<dr.from||d>dr.to)return false;}
    return true;
  });

  if(!invoices.length){
    const em=h('div',{className:'empty-state'});em.innerHTML=I.dollar;
    em.append(h('p',{className:'empty-state-title'},'No tax invoices in this period'),h('p',{className:'empty-state-hint'},'Tax invoices are created when NJ shipments are confirmed'));
    c.append(em);return c;
  }

  const cu=getCurrentUser();
  const gstRate=cu.gst_registered?(cu.gst_rate||15)/100:0;

  const tbl=h('table',{className:'table'});
  tbl.append(h('thead',{},h('tr',{},
    h('th',{className:'table-header'},'Invoice #'),
    h('th',{className:'table-header'},'Date'),
    h('th',{className:'table-header'},'Sub-customer'),
    h('th',{className:'table-header',style:{textAlign:'right'}},'Packets'),
    h('th',{className:'table-header',style:{textAlign:'right'}},'Amount (inc. GST)'),
    h('th',{className:'table-header'},''),
  )));
  const tbody=h('tbody',{});
  let grandTotal=0;

  invoices.forEach(inv=>{
    const run=S.shippingRuns.find(r=>r.id===inv.shipping_run_id);
    const retailer=run?S.retailers.find(r=>r.id===run.retailer_id):null;
    const discountMult=1-((retailer?.discount_pct)||0)/100;
    const runPackets=S.packets.filter(p=>p.shipping_run_id===inv.shipping_run_id);
    const valuationsTotal=runPackets.reduce((sum,p)=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===p.id);
      return sum+items.reduce((s,i)=>(s+(parseFloat(i.cost)||0)*discountMult),0);
    },0);
    const shippingExGST=run?(parseFloat(run.shipping_cost)||0)/1.15:0;
    const subtotal=valuationsTotal+shippingExGST;
    const total=subtotal*(1+gstRate);
    grandTotal+=total;

    const reprintBtn=h('button',{className:'btn-link',style:{fontSize:'var(--text-xs)'}},'Reprint');
    reprintBtn.addEventListener('click',()=>{
      try{printInvoice(runPackets,run?.retailer_id||0,scName(inv.sub_customer_id),inv.invoice_number,inv.issue_date,run?.shipping_cost||0,inv.sub_customer_id);}
      catch(e){console.warn(e);}
    });

    tbody.append(h('tr',{},
      h('td',{style:{fontFamily:'var(--font-mono)'}},inv.invoice_number||''),
      h('td',{},inv.issue_date||''),
      h('td',{},scName(inv.sub_customer_id)),
      h('td',{style:{textAlign:'right'}},String(runPackets.length)),
      h('td',{style:{textAlign:'right'}},fmtMoney(total)),
      h('td',{},reprintBtn),
    ));
  });

  tbody.append(h('tr',{style:{fontWeight:'var(--font-semibold)',borderTop:'2px solid var(--color-border)'}},
    h('td',{colspan:'4',style:{fontWeight:'var(--font-semibold)'}},'Total ('+invoices.length+' invoice'+(invoices.length!==1?'s':'')+')'),
    h('td',{style:{textAlign:'right',fontWeight:'var(--font-semibold)'}},fmtMoney(grandTotal)),
    h('td',{}),
  ));

  tbl.append(tbody);
  c.append(tbl);
  return c;
}

function filterShippingRuns(sr){
  let dr=null;
  if(sr.dateRange!=='custom')dr=getDateRange(sr.dateRange);
  else if(sr.dateFrom&&sr.dateTo)dr={from:new Date(sr.dateFrom),to:new Date(sr.dateTo+'T23:59:59')};
  return S.shippingRuns.filter(run=>{
    if(dr&&run.ship_date){const d=new Date(run.ship_date+'T00:00:00');if(d<dr.from||d>dr.to)return false;}
    return true;
  });
}
