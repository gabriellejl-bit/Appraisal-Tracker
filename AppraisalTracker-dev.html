async function sb(table,method,body,q){
  const r=await fetch(SB_URL+'/rest/v1/'+table+(q||''),{method,headers:hdrs(),...(body?{body:JSON.stringify(body)}:{})});
  if(!r.ok)throw new Error('Supabase '+r.status+': '+await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
const sbAll=(t,q)=>sb(t,'GET',null,'?select=*'+(q||''));
const sbInsert=(t,r)=>sb(t,'POST',r);

function fmtD(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();}
function todayISO(){return new Date().toISOString().split('T')[0];}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function tc(s){return s.split(/(\s|-)/).map(w=>/[a-zA-Z]/.test(w)?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w).join('');}
function esc(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function pad3(n){return String(n).padStart(3,'0');}

// Convert stored DD MMM YYYY back to YYYY-MM-DD for date input value
function dateToISO(s){
  if(!s)return '';
  const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const parts=s.split(' ');
  if(parts.length!==3)return '';
  return parts[2]+'-'+months[parts[1]]+'-'+parts[0].padStart(2,'0');
}

// Computed per-packet billing display status based on per-user billed flags
// Returns a display label and style independent of status_id
function packetBillingLabel(pkt){
  const pb=pkt.paula_billed||false;
  const gb=pkt.gabby_billed||false;
  if(pb&&gb)return 'Fully Billed';
  // Check if the other user has 0% on all items - if so, treat as Fully Billed
  const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
  if(pb&&items.length&&items.every(i=>(i.gabrielle_pct||0)===0))return 'Fully Billed';
  if(gb&&items.length&&items.every(i=>(i.paula_pct||0)===0))return 'Fully Billed';
  if(pb)return 'Billed (Paula)';
  if(gb)return 'Billed (Gabby)';
  return null; // fall through to status_id label
}

function packetCosts(packetId){
  const pkt=S.packets.find(p=>p.id===packetId);
  const retailer=S.retailers.find(r=>r.id===(pkt?pkt.retailer_id:null));
  const discountMult=retailer?(1-(retailer.discount_pct||0)/100):1;
  const items=S.allPacketItems.filter(i=>i.packet_id===packetId);
  let total=0,paula=0,gabby=0;
  items.forEach(i=>{const c=(parseFloat(i.cost)||0)*discountMult;total+=c;paula+=c*(i.paula_pct||0)/100;gabby+=c*(i.gabrielle_pct||0)/100;});
  return{total,paula,gabby};
}
function parseStoredDate(s){
  if(!s)return null;
  const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const p=s.split(' ');if(p.length!==3)return null;
  return new Date(+p[2],months[p[1]],+p[0]);
}
function getDateRange(key){
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth(),fyYear=mo>=3?yr:yr-1;
  switch(key){
    case 'today':{const d=new Date(yr,mo,now.getDate());return{from:d,to:new Date(yr,mo,now.getDate(),23,59,59)};}
    case 'week':{const d=new Date(now);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);const e=new Date(d);e.setDate(e.getDate()+6);e.setHours(23,59,59);return{from:d,to:e};}
    case 'month':return{from:new Date(yr,mo,1),to:new Date(yr,mo+1,0,23,59,59)};
    case 'lastmonth':{const lm=mo===0?11:mo-1,ly=mo===0?yr-1:yr;return{from:new Date(ly,lm,1),to:new Date(ly,lm+1,0,23,59,59)};}
    case 'thisfy':return{from:new Date(fyYear,3,1),to:new Date(fyYear+1,2,31,23,59,59)};
    case 'lastfy':return{from:new Date(fyYear-1,3,1),to:new Date(fyYear,2,31,23,59,59)};
    case 'lastweek':{const d=now.getDate();const dow=(now.getDay()+6)%7;const mon=new Date(yr,mo,d-dow-7);mon.setHours(0,0,0,0);const sun=new Date(yr,mo,d-dow-1);sun.setHours(23,59,59);return{from:mon,to:sun};}
    default:return null;
  }
}

// showToast -- injects a toast directly into DOM without calling render()
// Safe to use inside the form where re-rendering would wipe draft items
let _toastEl=null;let _toastTT=null;
function showToast(m,w){
  if(_toastTT)clearTimeout(_toastTT);
  if(!_toastEl){
    _toastEl=document.createElement('div');
    document.getElementById('app').appendChild(_toastEl);
  }
  _toastEl.className='toast'+(w?' warn':'');
  _toastEl.textContent=m;
  _toastEl.style.display='block';
  _toastTT=setTimeout(()=>{if(_toastEl)_toastEl.style.display='none';},3000);
}

function showDeleteConfirm(onConfirm){
  const overlay=h('div',{className:'modal-overlay',style:{alignItems:'center'},onClick:e=>{if(e.target===overlay)overlay.remove();}});
  const modal=h('div',{className:'modal',style:{maxWidth:'440px',background:'var(--bg)'}});

  const hdr=h('div',{className:'modal-header',style:{borderBottom:'none'}});
  hdr.append(h('h1',{className:'modal-title'},'Delete Work Packet'));
  modal.append(hdr);

  const body=h('div',{className:'modal-body',style:{paddingTop:'20px',paddingBottom:'24px'}});
  body.append(h('p',{style:{fontSize:'15px',color:'var(--text-sec)',lineHeight:'1.7'}},'This will permanently delete this packet and all its items. This action cannot be undone.'));
  modal.append(body);

  const foot=h('div',{className:'modal-footer',style:{borderTop:'none'}});
  const cancelBtn=h('button',{className:'btn btn-secondary',onClick:()=>overlay.remove()},'Cancel');
  const deleteBtn=h('button',{className:'btn btn-destructive',onClick:async()=>{
    deleteBtn.disabled=true;deleteBtn.textContent='Deleting...';
    try{await onConfirm();}
    catch(e){showToast('Delete failed: '+e.message,true);deleteBtn.disabled=false;deleteBtn.textContent='Delete';}
  }},'Delete');
  foot.append(cancelBtn,h('div',{className:'modal-footer-right'},deleteBtn));
  modal.append(foot);
  overlay.append(modal);
  document.body.append(overlay);
}

// Dollar value stats for current user
function getDollarStats(){
  const user=S.user;
  const cu=getCurrentUser();
  const taxMult=1-(cu.income_tax_rate||0)/100;
  const now=new Date();
  const yr=now.getFullYear(),mo=now.getMonth(),day=now.getDate();
  // Week start (Monday)
  const weekStart=new Date(yr,mo,day-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);
  const monthStart=new Date(yr,mo,1);

  let unbilled=0,earnedWeek=0,earnedMonth=0;

  S.packets.forEach(p=>{
    const userBilled=user==='paula'?(p.paula_billed||false):(p.gabby_billed||false);
    const sName=statusName(p.status_id);
    if(sName==='Archived')return;
    const retailer=S.retailers.find(r=>r.id===p.retailer_id);
    const discountMult=retailer?(1-(retailer.discount_pct||0)/100):1;
    const items=S.allPacketItems.filter(i=>i.packet_id===p.id);
    const userShare=items.reduce((sum,i)=>{
      const cost=(parseFloat(i.cost)||0)*discountMult;
      const pct=(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
      return sum+cost*pct*taxMult;
    },0);
    if(!userBilled&&sName!=='Hold from Billing'){
      unbilled+=userShare;
    }
    // Earned includes all work (billed or not), excluding Hold and Archived
    if(sName!=='Hold from Billing'){
      const d=parseStoredDate(p.date);
      if(d){
        if(d>=weekStart)earnedWeek+=userShare;
        if(d>=monthStart)earnedMonth+=userShare;
      }
    }
  });
  return{unbilled,earnedWeek,earnedMonth};
}

function getFiltered(){
  // Exclude Archived by default
  let pkts=S.packets.filter(r=>statusShowDash(r.status_id));
  if(!S.search)return pkts;
  const s=S.search.toLowerCase();
  return pkts.filter(r=>[r.surname,r.customer_ref,r.date].some(v=>(v||'').toLowerCase().includes(s)));
}

function getStats(){
  // Exclude Archived from dashboard counts
  const pkts=S.packets.filter(r=>statusShowDash(r.status_id));
  const byStatus={'New':0,'Hold from Billing':0,'Fully Billed':0,'Part Billed':0};
  pkts.forEach(r=>{
    const pb=r.paula_billed||false;
    const gb=r.gabby_billed||false;
    if(pb&&gb)byStatus['Fully Billed']++;
    else if(pb||gb)byStatus['Part Billed']++;
    else{
      const name=statusName(r.status_id);
      if(byStatus[name]!==undefined)byStatus[name]++;
    }
  });
  const retailers={};
  pkts.forEach(r=>{const n=retailerName(r.retailer_id)||'Unknown';retailers[n]=(retailers[n]||0)+1;});
  return{total:pkts.length,byStatus,retailers};
}

async function savePacket(headerData, itemsData){
  const now=fmtD(new Date());
  const pid=gid();
  const packet={
    id:pid,
    date:headerData.date,
    retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,
    sub_customer:headerData.subCustomer||null,
    surname:headerData.surname,
    status_id:statusId('New'),
    created:now,
    modified:now,
  };
  await sbInsert('packets',packet);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Navigate to edit mode so user can review and add more items
  S.view='edit';
  S.editId=pid;
  toast('Work packet saved');
  await renderAsync();
}

async function updatePacket(pid, headerData, itemsData){
  const now=fmtD(new Date());
  await sbUpdate('packets',pid,{
    date:headerData.date,retailer_id:headerData.retailerId,
    customer_ref:headerData.customerRef,surname:headerData.surname,
    sub_customer:headerData.subCustomer||null,modified:now,
  });
  // Delete old items and reinsert -- simplest approach for now
  const existing=await sbAll('packet_items','&packet_id=eq.'+pid);
  if(existing)for(const e of existing)await sbDelete('packet_items',e.id);
  for(const it of itemsData){
    await sbInsert('packet_items',{
      id:gid(),packet_id:pid,
      item:it.item,job_type_id:it.jobTypeId,
      cost:it.cost,paula_pct:it.paulaPct,gabrielle_pct:it.gabriellePct,
    });
  }
  await loadAll();
  // Stay in edit mode after update
  S.view='edit';
  toast('Work packet updated');
  await renderAsync();
}

  const hdr=['Packet ID','Date','Retailer','Customer Ref','Surname','Status','Total ($)','Paula ($)','Gabby ($)'];
  const data=rows.map(p=>{const c=packetCosts(p.id);return[p.id,p.date,retailerName(p.retailer_id),p.customer_ref,p.surname,statusName(p.status_id),c.total.toFixed(2),c.paula.toFixed(2),c.gabby.toFixed(2)].map(esc).join(',');});
  const csv=[hdr.join(','),...data].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='billing_'+new Date().toISOString().slice(0,10)+'.csv';

// RENDER HELPERS

function h(tag,a,...ch){
  const el=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')el.className=v;
    else if(k==='htmlContent')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch.flat()){if(c==null||c===false)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;
}

function applyRecordFilters(pkts){
  const f=S.recFilters;
  let result=pkts;
  if(!f.showArchived)result=result.filter(r=>statusShowDash(r.status_id));
  if(f.statuses.length)result=result.filter(r=>f.statuses.includes(r.status_id));
  if(f.retailerId)result=result.filter(r=>r.retailer_id===f.retailerId);
  if(f.user!=='all'){
    result=result.filter(r=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===r.id);
      if(!items.length)return false;
      return f.user==='paula'?items.some(i=>(i.paula_pct||0)>0):items.some(i=>(i.gabrielle_pct||0)>0);
    });
  }
  let dr=null;
  if(f.dateRange!=='all'&&f.dateRange!=='custom')dr=getDateRange(f.dateRange);
  else if(f.dateRange==='custom'&&f.dateFrom&&f.dateTo)dr={from:new Date(f.dateFrom),to:new Date(f.dateTo+'T23:59:59')};
  if(dr)result=result.filter(r=>{const d=parseStoredDate(r.date);return d&&d>=dr.from&&d<=dr.to;});
  if(f.search){const s=f.search.toLowerCase();result=result.filter(r=>[r.surname,r.customer_ref,r.date].some(v=>(v||'').toLowerCase().includes(s)));}
  return result;
}

function renderForm(packet){
  window.scrollTo(0,0);
  const isEdit=!!packet;
  const defaultPct=S.user==='paula'?100:0;

  // Guard -- if lookups not loaded yet
  if(!S.retailers.length||!S.jobTypes.length||!S.items.length){
    const retryBtn=h('button',{className:'btn btn-secondary',style:{marginTop:'var(--space-md)'},onClick:async()=>{await loadAll();render();}});
    retryBtn.innerHTML='Retry';
    return h('div',{className:'form-wrap fade-up'},
      h('h1',{className:'form-page-title'},'New Work Packet'),
      h('div',{className:'form-section'},
        h('p',{className:'para',style:{color:'var(--ember)'}},'Lookup data not loaded. Check Supabase tables (retailers, items, job_types) exist and contain data.'),
        retryBtn,
      )
    );
  }

  // -- PACKET HEADER STATE (hdr) --
  // hdr = mutable packet-level fields shared across all form sections
  const hdr={
    dateISO:packet?dateToISO(packet.date):todayISO(),
    date:packet?packet.date:fmtD(new Date()),
    retailerId:packet?packet.retailer_id:S.retailers[0].id,
    customerRef:packet?packet.customer_ref:'',
    refSuffix:'',
    surname:packet?packet.surname:'',
    subCustomer:packet?packet.sub_customer:'',
  };

  const isNJ=()=>{const r=S.retailers.find(x=>x.id===hdr.retailerId);return r&&r.name==='Nationwide Jewellers';}

  // Derive suffix from existing ref
  if(packet&&packet.customer_ref){
    const parts=packet.customer_ref.split('-');
    hdr.refSuffix=parts.length>1?parts.slice(1).join('-'):packet.customer_ref;
  }

  const makeItem=()=>({
    id:gid(),
    item:S.items[0]?.name||'',
    jobTypeId:S.jobTypes[0]?.id||null,
    cost:S.jobTypes[0]?.cost||60,
    paulaPct:defaultPct,
    gabriellePct:100-defaultPct,
  });

  // -- FIELD ERROR HELPERS --
  const clearFieldError = (input, errorEl) => {
    input.classList.remove('error');
    errorEl.style.display = 'none';
  };

  const showFieldError = (input, errorEl, message) => {
    input.classList.add('error');
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  };

  // -- ITEM STATE --
  // Pre-loaded into S.editItems by renderAsync before renderForm is called (edit mode).
  // renderForm is synchronous; S.editItems is cleared after use.
  const formItems=[];
  if(isEdit && S.editItems && S.editItems.length){
    S.editItems.forEach(row=>{
      const jt=S.jobTypes.find(j=>j.id===row.job_type_id);
      if(!jt){
        // Job type no longer in lookup -- show warning card with raw values
        formItems.push({
          id:row.id,
          item:row.item||S.items[0]?.name||'',
          jobTypeId:S.jobTypes[0]?.id||null,
          cost:parseFloat(row.cost)||60,
          paulaPct:row.paula_pct!=null?row.paula_pct:0,
          gabriellePct:row.gabrielle_pct!=null?row.gabrielle_pct:100,
          _warning:'Job type not found in lookup (id:'+row.job_type_id+')',
        });
      } else {
        formItems.push({
          id:row.id,
          item:row.item||S.items[0]?.name||'',
          jobTypeId:row.job_type_id,
          cost:parseFloat(row.cost)||jt.cost,
          paulaPct:row.paula_pct!=null?row.paula_pct:0,
          gabriellePct:row.gabrielle_pct!=null?row.gabrielle_pct:100,
        });
      }
    });
  } else {
    formItems.push(makeItem());
  }

  // -- FORM SCAFFOLD (title, wrapper, sticky header) --
  const isEditTitle=isEdit?'Edit Packet':'New Packet';
  const wrap=h('div',{className:'form-wrap fade-up'});

  // -- PACKET DETAILS SECTION (billing status + date/retailer/ref/surname fields) --
  const headerSection=h('div',{className:'form-section'});
  if(isEdit&&packet){
    const pBilled=packet.paula_billed||false;
    const gBilled=packet.gabby_billed||false;
    const curStatusName=statusName(packet.status_id);
    const isHold=curStatusName==='Hold from Billing';
    const isArchived=curStatusName==='Archived';
    const billingDisabled=isHold||isArchived;

    // Title row: "Packet Details" + "Delete this packet" link
    const delBtn=h('button',{className:'btn-link-destructive',style:{padding:'0'},onClick:()=>{
      showDeleteConfirm(async()=>{
        const existingItems=await sbAll('packet_items','&packet_id=eq.'+packet.id)||[];
        for(const ei of existingItems)await sbDelete('packet_items',ei.id);
        await sbDelete('packets',packet.id);
        await loadAll();
        S.view='records';S.editId=null;
        toast('Packet deleted');
      });
    }},'Delete this packet');
    headerSection.append(h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'var(--space-xs) 0',marginBottom:'var(--space-lg)'}},
      h('p',{className:'h2',style:{margin:0,padding:0}},'Packet Details'),
      delBtn

    // Fully billed warning
    if(pBilled&&gBilled){
      headerSection.append(h('div',{className:'fully-billed-warning',style:{marginBottom:'var(--space-md)'}},ic('alert'),'Both users billed - changes may affect completed invoices'));
    }

    // Status row: lozenges (left) + billing flags (right)
    const lozengeRow=h('div',{className:'status-lozenges',style:{margin:0,flexWrap:'nowrap'}});
    const lozengeConfig=[
      {name:'New',cls:'active-new',disabled:false},
      {name:'Hold from Billing',cls:'active-hold',disabled:pBilled||gBilled},
      {name:'Archived',cls:'active-archived',disabled:false},
    ];
    lozengeConfig.forEach(({name,cls,disabled})=>{
      const isActive=curStatusName===name;
      const loz=h('button',{className:'status-lozenge'+(isActive?' '+cls:'')});
      loz.dataset.lozenge=cls;
      loz.textContent=name==='Hold from Billing'?'Hold':name;
      loz.title=name;
      if(disabled&&!isActive)loz.disabled=true;
      loz.addEventListener('click',async()=>{
        if(isActive)return;
        const newStatusId=statusId(name);
        const updateData={status_id:newStatusId,modified:fmtD(new Date())};
        if(name==='New'){updateData.paula_billed=false;updateData.gabby_billed=false;}
        try{
          await sbUpdate('packets',packet.id,updateData);
          await loadAll();S.editId=packet.id;S.view='edit';renderAsync();
        }catch(e2){showToast('Failed: '+e2.message,true);}
      });
      lozengeRow.append(loz);
    });
    const billingFlagsRow=h('div',{style:{display:'flex',gap:'var(--space-xs)',alignItems:'center'}});
    [{label:'Paula',billedKey:'paula_billed',otherKey:'gabby_billed',otherPctField:'paula_pct'},{label:'Gabby',billedKey:'gabby_billed',otherKey:'paula_billed',otherPctField:'gabrielle_pct'}].forEach(({label,billedKey,otherKey,otherPctField})=>{
      const isBilled=packet[billedKey]||false;
      const unbilledClass=label==='Paula'?'unbilled-paula':'unbilled-gabby';
      const btn=h('button',{className:'billing-flag-btn '+(isBilled?'billed':unbilledClass)});
      btn.textContent=label+': '+(isBilled?'Billed':'Unbilled');
      if(billingDisabled)btn.disabled=true;
      btn.addEventListener('click',async()=>{
        const newVal=!isBilled;
        const updateData={[billedKey]:newVal,modified:fmtD(new Date())};
        if(!newVal){
          updateData.status_id=statusId('New');

// Get all packet_items matching current billing filters + checked selection
function getBillingItems(){
  const f=S.billing.filters;
  const user=S.user;
  // Filter packets: current user not yet billed, not Hold/Archived, date range
  let pkts=S.packets.filter(p=>{
    // Exclude Hold from Billing and Archived
    const sName=statusName(p.status_id);
    if(sName==='Hold from Billing'||sName==='Archived')return false;
    // Exclude if current user has already billed this packet
    if(user==='paula'&&(p.paula_billed||false))return false;
    if(user==='gabby'&&(p.gabby_billed||false))return false;
    return true;
  });
  // Apply any additional status filter from UI
  if(f.statuses.length)pkts=pkts.filter(p=>f.statuses.includes(p.status_id));
  // Date range
  let dr=null;
  if(f.dateRange!=='all'&&f.dateRange!=='custom')dr=getDateRange(f.dateRange);
  else if(f.dateRange==='custom'&&f.dateFrom&&f.dateTo)dr={from:new Date(f.dateFrom),to:new Date(f.dateTo+'T23:59:59')};
  if(dr)pkts=pkts.filter(p=>{const d=parseStoredDate(p.date);return d&&d>=dr.from&&d<=dr.to;});
  // Get packet_items for filtered packets, excluding items where user has 0%
  const pktIds=new Set(pkts.map(p=>p.id));
  return S.allPacketItems.filter(i=>{
    if(!pktIds.has(i.packet_id))return false;
    // For combined-billing retailers, Gabby invoices full cost — include all items
    const pkt=S.packets.find(p=>p.id===i.packet_id);
    if(pkt&&isRetailerCombined(pkt.retailer_id)&&user==='gabby')return true;
    // Standard: exclude if this user has 0% on this item
    const pct=user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0);
    return pct>0;
  });
}

const INVOICE_GROUPS={'Pearl Threading':'Pearl Threading','Stock Update':'Stock','Stock - New':'Stock'};
function invoiceGroup(jtName){return INVOICE_GROUPS[jtName]||'Valuations';}
function isRetailerCombined(retailerId){const r=S.retailers.find(r=>r.id===retailerId);return !!(r&&r.combined_billing);}

function buildInvoiceSummary(items,retailerId){
  const user=S.user;
  const retailer=S.retailers.find(r=>r.id===retailerId);
  const discountPct=retailer?retailer.discount_pct||0:0;
  const discountMult=1-discountPct/100;
  const isNJRetailer=retailer&&retailer.name==='Nationwide Jewellers';
  const isCombined=!!(retailer&&retailer.combined_billing);
  const isCombinedGabby=isCombined&&user==='gabby';
  const isCombinedPaula=isCombined&&user==='paula';

  // Pre-seed in display order: Valuations first, then Stock, then Pearl Threading
  const byJobType={'Valuations':0,'Stock':0,'Pearl Threading':0};
  const bySubCustomer={};// NJ only: {subCustomer: {jobTypeName: amount}}

  items.forEach(i=>{
    const pkt=S.packets.find(p=>p.id===i.packet_id);
    if(!pkt||pkt.retailer_id!==retailerId)return;
    const cost=(parseFloat(i.cost)||0)*discountMult;
    const pct=isCombinedGabby?1:(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
    const userCost=cost*pct;
    const jt=S.jobTypes.find(j=>j.id===i.job_type_id);
    const jtName=jt?jt.name:'Unknown';
    const grp=invoiceGroup(jtName);
    byJobType[grp]+=userCost;
    if(isNJRetailer){
      const sc=pkt.sub_customer||'Unassigned';
      if(!bySubCustomer[sc])bySubCustomer[sc]={};
      if(!bySubCustomer[sc][jtName])bySubCustomer[sc][jtName]=0;
      bySubCustomer[sc][jtName]+=userCost;
    }
  });
  // Remove groups with zero value so they don't appear on the invoice
  Object.keys(byJobType).forEach(k=>{if(byJobType[k]===0)delete byJobType[k];});
  const subtotal=Object.values(byJobType).reduce((a,b)=>a+b,0);
  const gst=subtotal*(getCurrentUser().gst_rate||0)/100;
  const total=subtotal+gst;
  return{byJobType,bySubCustomer,subtotal,gst,total,discountPct,isNJRetailer,isCombined,isCombinedGabby,isCombinedPaula};
}

function stepIndicator(current,total){
  // Shows: Selection > Retailer 1 > ... > Generate > Confirm
  const steps=['Selection',...S.billing.retailers.map((_,i)=>'Retailer '+(i+1)),'Generate','Confirm'];
  const wrap=h('div',{className:'step-indicator'});

    dot.title=label;
    wrap.append(dot);
  });
  return wrap;
}

    const ti=h('input',{type:'date',className:'input',style:{flex:'1'},value:f.dateTo});
    fi.addEventListener('input',e=>{f.dateFrom=e.target.value;render();});
    ti.addEventListener('input',e=>{f.dateTo=e.target.value;render();});
    cr.append(fi,h('span',{style:{color:'var(--text-muted)',fontSize:'13px'}},'to'),ti);
    drWrap.append(cr);
  }
  fb.append(drWrap);
  c.append(fb);

  // Items table
  const allItems=getBillingItems();
  const user=S.user;

  // Auto-select all items on first load only
  // Use initialised flag so unchecking all doesn't re-trigger auto-select
  if(allItems.length&&!b.initialised){
    allItems.forEach(i=>b.selectedItemIds.add(i.id));
    b.initialised=true;
  }

  // selCount declared here so it's in scope for the footer
  const selCount=b.selectedItemIds.size;

  if(!allItems.length){
    c.append(h('div',{style:{textAlign:'center',padding:'48px',color:'var(--text-muted)',fontSize:'14px'}},'No records match the selected filters.'));
  } else {
    const allChk=h('input',{type:'checkbox'});
    const allChecked=allItems.every(i=>b.selectedItemIds.has(i.id));
    allChk.checked=allChecked;
    allChk.addEventListener('change',()=>{allItems.forEach(i=>allChk.checked?b.selectedItemIds.add(i.id):b.selectedItemIds.delete(i.id));render();});

    const panel=h('div',{className:'panel'});
    const tbl=h('table',{});
    tbl.append(h('thead',{},h('tr',{},
      h('th',{style:{width:'36px',paddingLeft:'14px'}},allChk),
      h('th',{},'Date'),h('th',{},'Ref'),h('th',{},'Surname'),h('th',{},'Retailer'),h('th',{},'Item'),h('th',{},'Job Type'),
      h('th',{style:{textAlign:'right'}},user==='paula'?'Paula ($)':'Gabby ($)'),
    )));
    const tb=h('tbody',{});

    allItems.forEach(i=>{
      const pkt=S.packets.find(p=>p.id===i.packet_id)||{};
      const jt=S.jobTypes.find(j=>j.id===i.job_type_id)||{};
      const cost=parseFloat(i.cost)||0;
      const pct=(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
      const userCost=cost*pct;
      const retName=retailerName(pkt.retailer_id);
      const cb=h('input',{type:'checkbox'});
      cb.checked=b.selectedItemIds.has(i.id);
      cb.addEventListener('change',()=>{b.selectedItemIds[cb.checked?'add':'delete'](i.id);render();});
      tb.append(h('tr',{style:{background:b.selectedItemIds.has(i.id)?'var(--gold-light)':''}},
        h('td',{style:{paddingLeft:'14px'}},cb),
        h('td',{className:'mono'},pkt.date||''),
        h('td',{className:'mono'},pkt.customer_ref||''),
        h('td',{className:'name-cell'},pkt.surname||''),
        h('td',{},h('span',{className:retName==='Alexandra'?'badge badge-plum':'badge badge-ember'},retName)),
        h('td',{},i.item||''),
        h('td',{},jt.name||''),
        h('td',{style:{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'13px'}},fmtMoney(userCost)),
      ));
    });
    tbl.append(tb);panel.append(tbl);c.append(panel);
  }

  // Footer actions
  const footer=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid var(--border)'}});
  footer.append(
    h('span',{style:{fontSize:'13px',color:'var(--text-muted)'}},selCount+' item'+(selCount!==1?'s':'')+' selected'),
    h('div',{style:{display:'flex',gap:'10px'}},
      h('button',{className:'btn btn-secondary',onClick:()=>{S.view='home';render();}},'Cancel'),
      h('button',{className:'btn btn-primary',onClick:()=>{
        if(b.selectedItemIds.size===0){showToast('No items selected',true);return;}
        // Work out which retailers have selected items, in order
        const retIds=[];
        S.retailers.forEach(r=>{
          const has=S.allPacketItems.some(i=>b.selectedItemIds.has(i.id)&&(S.packets.find(p=>p.id===i.packet_id)||{}).retailer_id===r.id);
          if(has)retIds.push(r.id);
        });
        if(!retIds.length){showToast('No matching retailers found',true);return;}
        b.retailers=retIds;b.retailerIdx=0;b.step=2;render();
      }},'Start'),
    ),
  );
  c.append(footer);
  return c;
}

// STEP 3 -- Generate PDFs
function generatePDFContent(retailerId){
  const b=S.billing;const user=S.user;
  const retName=retailerName(retailerId);
  const pdfRetName={'Alexandra':'Jamies Alexandra','Queenstown':'Jamies Queenstown'}[retName]||retName;
  const displayName=getCurrentUser().name;
  const retailer=S.retailers.find(r=>r.id===retailerId);
  const discountPct=retailer?retailer.discount_pct||0:0;
  const discountMult=1-discountPct/100;
  const isNJRetailer=retailer&&retailer.name==='Nationwide Jewellers';
  const myItems=S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)&&(S.packets.find(p=>p.id===i.packet_id)||{}).retailer_id===retailerId);
  const summary=buildInvoiceSummary(myItems,retailerId);
  const {isCombinedGabby,isCombinedPaula}=summary;
  const now=new Date();

  let lines=[];
  lines.push('PGJ Appraisals, Detailed Report');
  lines.push(isCombinedGabby?pdfRetName:pdfRetName+' -- '+(isCombinedPaula?'Invoice to: Gabby Lovering':displayName));
  lines.push(fmtD(now));
  const bf=S.billing.filters;
  if(bf.dateRange==='all'){lines.push('Period: All dates');}
  else if(bf.dateRange==='custom'&&bf.dateFrom&&bf.dateTo){lines.push('Period: '+bf.dateFrom+' to '+bf.dateTo);}
  else{const dr=getDateRange(bf.dateRange);if(dr)lines.push('Period: '+fmtD(dr.from)+' to '+fmtD(dr.to));}
  lines.push('');
  lines.push('ITEM DETAILS');
  lines.push('-'.repeat(isNJRetailer?100:90));
  const hdrCols=isNJRetailer
    ?('Date').padEnd(14)+('Ref').padEnd(18)+('Sub-customer').padEnd(14)+('Surname').padEnd(14)+('Item').padEnd(14)+('Job Type').padEnd(18)+('Cost').padStart(8)
    :('Date').padEnd(14)+('Ref').padEnd(12)+('Surname').padEnd(16)+('Item').padEnd(18)+('Description').padEnd(22)+('Cost').padStart(8);
  lines.push(hdrCols);
  lines.push('-'.repeat(isNJRetailer?100:90));
  myItems.forEach(i=>{
    const pkt=S.packets.find(p=>p.id===i.packet_id)||{};
    const jt=S.jobTypes.find(j=>j.id===i.job_type_id)||{};
    const cost=(parseFloat(i.cost)||0)*discountMult;
    const pct=isCombinedGabby?1:(user==='paula'?(i.paula_pct||0):(i.gabrielle_pct||0))/100;
    if(isNJRetailer){
      lines.push(
        (pkt.date||'').padEnd(14)+
        (pkt.customer_ref||'').substring(0,16).padEnd(18)+
        (pkt.sub_customer||'').substring(0,12).padEnd(14)+
        (pkt.surname||'').substring(0,12).padEnd(14)+
        (i.item||'').substring(0,12).padEnd(14)+
        (jt.name||'').substring(0,16).padEnd(18)+
        fmtMoney(cost*pct).padStart(8)
      );
    } else {
      lines.push(
        (pkt.date||'').padEnd(14)+
        (pkt.customer_ref||'').padEnd(12)+
        (pkt.surname||'').substring(0,14).padEnd(16)+
        (i.item||'').substring(0,16).padEnd(18)+
        (jt.name||'').substring(0,20).padEnd(22)+
        fmtMoney(cost*pct).padStart(8)
      );
    }
  });
  lines.push('-'.repeat(isNJRetailer?100:90));
  lines.push('');
  lines.push('SUMMARY');
  lines.push('-'.repeat(40));

  if(isNJRetailer&&Object.keys(summary.bySubCustomer).length){
    Object.entries(summary.bySubCustomer).forEach(([sc,jobTypes])=>{
      lines.push(sc+':');
      Object.entries(jobTypes).forEach(([name,amt])=>{
        lines.push('  '+name.padEnd(28)+fmtMoney(amt).padStart(10));
      });
    });
    lines.push('-'.repeat(40));
    const grossSubtotal=summary.subtotal/discountMult;
    const discountAmt=grossSubtotal-summary.subtotal;
    lines.push('Subtotal (before discount)'.padEnd(30)+fmtMoney(grossSubtotal).padStart(10));
    lines.push(('Discount ('+discountPct+'%)').padEnd(30)+('-'+fmtMoney(discountAmt)).padStart(10));
  } else {
    Object.entries(summary.byJobType).forEach(([name,amt])=>{
      lines.push(name.padEnd(30)+fmtMoney(amt).padStart(10));
    });
    lines.push('-'.repeat(40));
  }

  lines.push('Subtotal'.padEnd(30)+fmtMoney(summary.subtotal).padStart(10));
  const cu=getCurrentUser();
  if(cu.gst_registered){
    const gstAmt=summary.subtotal*(cu.gst_rate/100);
    lines.push(('GST ('+cu.gst_rate+'%)').padEnd(30)+fmtMoney(gstAmt).padStart(10));
  }
  const totalAmt=cu.gst_registered?summary.subtotal*(1+cu.gst_rate/100):summary.subtotal;
  lines.push('TOTAL'.padEnd(30)+fmtMoney(totalAmt).padStart(10));
  lines.push('');
  lines.push('Total items: '+myItems.length);
  return lines.join('\n');
}

function downloadTextAsPDF(text, filename){
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const lines=text.split('\n');
  let y=15;
  lines.forEach(line=>{
    if(y>275){doc.addPage();y=15;}
    const size=line.startsWith('PGJ')?13:line.startsWith('-')?8:9;
    const bold=line.startsWith('PGJ')||line.startsWith('SUMMARY')||line.startsWith('ITEM')||line.startsWith('TOTAL')||line.startsWith('Subtotal');
    doc.setFontSize(size);
    doc.setFont('courier',bold?'bold':'normal');
    doc.text(line,10,y);
    y+=size===13?7:4.5;
  });
  doc.save(filename);
}

// STEP 4 -- Confirm + Mark as Billed
function renderBillingStep4(){
  const b=S.billing;
  const user=S.user;
  const displayName=user==='paula'?'Paula':'Gabby';

  // Count packets (not items) involved
  const pktIds=new Set(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)).map(i=>i.packet_id));

  const c=h('div',{});
  c.append(h('div',{className:'dash-header'},
    h('div',{},h('h1',{className:'dash-greeting',style:{fontSize:'24px'}},'Confirm Billing'),h('p',{className:'dash-date'},'This will mark all selected packets as Billed')),
  ));

  const card=h('div',{className:'panel',style:{maxWidth:'560px',margin:'0 auto'}});
  const body=h('div',{style:{padding:'24px 28px'}});

  body.append(h('p',{style:{fontSize:'15px',color:'var(--deep)',marginBottom:'20px'}},
    'You are about to mark ',h('strong',{},String(pktIds.size)+' packet'+(pktIds.size!==1?'s':'')),
    ' as ',h('strong',{},'Billed'),' for ',h('strong',{},displayName),'.'));

  // Retailer breakdown
  b.retailers.forEach(rid=>{
    const retName=retailerName(rid);
    const retPktIds=new Set(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)&&(S.packets.find(p=>p.id===i.packet_id)||{}).retailer_id===rid).map(i=>i.packet_id));
    const summary=buildInvoiceSummary(S.allPacketItems.filter(i=>b.selectedItemIds.has(i.id)),rid);
    body.append(h('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border-light)'}},
      h('span',{style:{fontWeight:'600'}},retName),
      h('span',{style:{color:'var(--text-sec)'}},retPktIds.size+' packets  -  '+fmtMoney(summary.total)),
    ));
  });

  body.append(h('p',{style:{fontSize:'13px',color:'var(--text-muted)',marginTop:'16px'}},'This action cannot be undone. Ensure you have copied the invoice details and downloaded the PDF reports before confirming.'));
  card.append(body);

  const confirmBtn=h('button',{className:'btn btn-primary',onClick:async()=>{
    confirmBtn.disabled=true;confirmBtn.textContent='Updating...';
    try{
      const now=fmtD(new Date());
      const billedCol=user==='paula'?'paula_billed':'gabby_billed';
      const billedStatusId=statusId('Billed');
      for(const pid of pktIds){
        const pkt=S.packets.find(p=>p.id===pid)||{};
        const otherBilled=user==='paula'?(pkt.gabby_billed||false):(pkt.paula_billed||false);
        const otherHasNoWork=user==='paula'
          ?S.allPacketItems.filter(i=>i.packet_id===pid).every(i=>(i.gabrielle_pct||0)===0)
          :S.allPacketItems.filter(i=>i.packet_id===pid).every(i=>(i.paula_pct||0)===0);
        const updateData={[billedCol]:true,modified:now};
        if(otherBilled||otherHasNoWork){updateData.status_id=billedStatusId;}
        await sbUpdate('packets',pid,updateData);
      }
      // Save billing run record
      const runId=gid();
      await sbInsert('billing_runs',{
        id:runId,run_date:fmtD(new Date()),user_name:user,
        retailer_ids:b.retailers.join(','),
        packet_ids:[...pktIds].join(','),
        status:'completed',created:now,
      });
      await loadAll();
      b.step=0;S.view='reports';
      toast('Billing complete -- '+pktIds.size+' packets marked as Billed for '+(user==='paula'?'Paula':'Gabby'));
    }catch(e){showToast('Error: '+e.message,true);confirmBtn.disabled=false;confirmBtn.textContent='Confirm + Mark as Billed';}
  }},'Confirm + Mark as Billed');

  const foot=h('div',{style:{display:'flex',justifyContent:'space-between',padding:'16px 28px',borderTop:'1px solid var(--border)'}});
  foot.append(
    h('button',{className:'btn btn-secondary',onClick:()=>{b.step=3;render();}},ic('back'),'Back'),
    h('div',{style:{display:'flex',gap:'10px'}},
      h('button',{className:'btn btn-secondary',onClick:()=>{S.view='home';b.step=0;render();}},'Cancel'),
      confirmBtn,
    ),
  );
  card.append(foot);
  c.append(card);
  return c;
}

function renderBillingRunsReport(){
  const c=h('div',{});
  c.append(renderBreadcrumb('Billing Runs'));
  c.append(h('div',{className:'dash-header'},
    h('div',{},h('h1',{className:'dash-greeting',style:{fontSize:'24px'}},'Billing Runs'),h('p',{className:'dash-date'},S.billingRuns.length+' billing run'+(S.billingRuns.length!==1?'s':''))),
  ));

  if(!S.billingRuns.length){
    const em=h('div',{style:{textAlign:'center',padding:'60px 20px',color:'var(--text-muted)'}});
    em.innerHTML=I.empty;
    em.append(h('p',{style:{fontFamily:'var(--font-display)',fontSize:'16px',color:'var(--text-sec)',margin:'16px 0 4px'}},'No billing runs yet'),h('p',{style:{fontSize:'13px'}},'Complete a Run Billing to see reports here'));
    c.append(em);return c;
  }

  const panel=h('div',{className:'panel'});
  const tbl=h('table',{});
  tbl.append(h('thead',{},h('tr',{},h('th',{},'Date'),h('th',{},'User'),h('th',{},'Retailers'),h('th',{},'Packets'),h('th',{}))));
  const tb=h('tbody',{});

  S.billingRuns.forEach(run=>{
    const retNames=run.retailer_ids.split(',').map(id=>retailerName(parseInt(id))).join(', ');
    const pktCount=run.packet_ids?run.packet_ids.split(',').length:0;

    const regenBtn=h('button',{className:'btn-small',style:{fontSize:'12px'},onClick:()=>{
      S.billing.selectedItemIds=new Set();
      const pktIds=run.packet_ids.split(',');
      S.allPacketItems.filter(i=>pktIds.includes(i.packet_id)).forEach(i=>S.billing.selectedItemIds.add(i.id));
      S.billing.retailers=run.retailer_ids.split(',').map(Number);
      S.billing.retailerIdx=0;
      S.billing.step=3;
      S.user=run.user_name;
      S.view='billing';
      render();
    }},ic('refresh'),' Regenerate PDFs');

    const delBtn=h('button',{className:'edit-btn',title:'Delete run',onClick:async()=>{
      if(!confirm('Delete this billing run record?'))return;
      try{await sbDelete('billing_runs',run.id);await loadAll();render();}
      catch(e){showToast('Delete failed: '+e.message,true);}
    }});delBtn.innerHTML=I.trash;

    tb.append(h('tr',{},
      h('td',{className:'mono'},run.run_date),
      h('td',{},run.user_name==='paula'?'Paula':'Gabby'),
      h('td',{},retNames),
      h('td',{},String(pktCount)),
      h('td',{style:{display:'flex',gap:'8px',alignItems:'center'}},regenBtn,delBtn),
    ));
  });
  tbl.append(tb);panel.append(tbl);c.append(panel);
  return c;
}


// =============================================================================
// CUSTOMER REPORT
// =============================================================================
function renderCustomerReportPage(){
  const c=h('div',{});
  const cr=S.customerReport;

  // Breadcrumb + page header
  c.append(renderBreadcrumb('Customer Report'));
  c.append(h('div',{className:'dash-header'},
    h('div',{},
      h('h1',{className:'dash-greeting',style:{fontSize:'24px'}},'Customer Report'),
      h('p',{className:'dash-date'},'Total cost by customer across both users'),
    ),
  ));

  // Filter bar
  const fb=h('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rounded-3xl)',padding:'16px 20px',marginBottom:'16px',display:'flex',flexWrap:'wrap',gap:'16px',alignItems:'flex-end'}});

  // Date range pills
  const drWrap=h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}});
  drWrap.append(h('label',{className:'label',style:{marginBottom:'0'}},'Date Range'));
  const drPills=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
  [['month','This Month'],['lastmonth','Last Month'],['thisfy','This FY'],['lastfy','Last FY'],['custom','Custom']].forEach(([v,l])=>{
    const on=cr.dateRange===v;
    const p=h('button',{style:{padding:'5px 10px',borderRadius:'20px',border:'1px solid',fontSize:'12px',fontWeight:'600',cursor:'pointer',fontFamily:'var(--font-body)',
      borderColor:on?'var(--gold)':'var(--border)',background:on?'var(--gold-light)':'var(--surface)',color:on?'var(--gold-dark)':'var(--text-muted)'}},l);
    p.addEventListener('click',()=>{cr.dateRange=v;render();});
    drPills.append(p);
  });
  drWrap.append(drPills);
  if(cr.dateRange==='custom'){
    const row=h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginTop:'6px'}});
    const fi=h('input',{type:'date',className:'input',style:{flex:'1'},value:cr.dateFrom});
    const ti=h('input',{type:'date',className:'input',style:{flex:'1'},value:cr.dateTo});
    fi.addEventListener('input',e=>{cr.dateFrom=e.target.value;render();});
    ti.addEventListener('input',e=>{cr.dateTo=e.target.value;render();});
    row.append(fi,h('span',{style:{color:'var(--text-muted)',fontSize:'13px'}},'to'),ti);
    drWrap.append(row);
  }
  fb.append(drWrap);

  // Retailer filter
  const retSel=h('select',{className:'select',style:{minWidth:'160px'}});
  retSel.append(h('option',{value:''},'All Retailers'));
  S.retailers.forEach(r=>{
    const o=h('option',{value:String(r.id)},r.name);
    if(cr.retailerId===r.id)o.selected=true;
    retSel.append(o);
  });
  retSel.addEventListener('change',e=>{cr.retailerId=e.target.value?parseInt(e.target.value):null;render();});
  fb.append(h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},h('label',{className:'label',style:{marginBottom:'0'}},'Retailer'),retSel));

  // Download PDF button
  const dlBtn=h('button',{className:'btn btn-primary btn-sm',style:{alignSelf:'flex-end'},onClick:()=>downloadCustomerReportPDF(filteredPackets,cr)},ic('download'),'Download PDF');
  fb.append(dlBtn);
  c.append(fb);

  // Filter packets by date range
  let dr=null;
  if(cr.dateRange!=='custom')dr=getDateRange(cr.dateRange);
  else if(cr.dateFrom&&cr.dateTo)dr={from:new Date(cr.dateFrom),to:new Date(cr.dateTo+'T23:59:59')};

  let filteredPackets=S.packets.filter(p=>{
    if(cr.retailerId&&p.retailer_id!==cr.retailerId)return false;
    if(dr){const d=parseStoredDate(p.date);if(!d||d<dr.from||d>dr.to)return false;}
    return true;
  });
  // Sort by retailer then customer ref
  filteredPackets.sort((a,b)=>{
    if(a.retailer_id!==b.retailer_id)return a.retailer_id-b.retailer_id;
    return (a.customer_ref||'').localeCompare(b.customer_ref||'');
  });

  if(!filteredPackets.length){
    c.append(h('div',{style:{textAlign:'center',padding:'48px',color:'var(--text-muted)',fontSize:'14px'}},'No packets match the selected filters.'));
    return c;
  }

  // Group by retailer
  const byRetailer={};
  filteredPackets.forEach(p=>{
    const rid=p.retailer_id;
    if(!byRetailer[rid])byRetailer[rid]=[];
    byRetailer[rid].push(p);
  });

  Object.entries(byRetailer).forEach(([rid,pkts])=>{
    const retName=retailerName(parseInt(rid));
    const section=h('div',{className:'panel',style:{marginBottom:'20px'}});

    // Retailer header
    section.append(h('div',{className:'panel-header'},
      h('span',{className:'panel-title'},retName),
      h('span',{style:{fontSize:'13px',color:'var(--text-muted)'}},pkts.length+' packet'+(pkts.length!==1?'s':'')),
    ));

    // Items table
    const tbl=h('table',{className:'summary-table'});
    tbl.append(h('thead',{},h('tr',{},
      h('th',{},'Ref'),h('th',{},'Surname'),h('th',{},'Item'),h('th',{},'Job Type'),h('th',{className:'right'},'Cost'),
    )));
    const tb=h('tbody',{});

    let retailerTotal=0;let retailerItemCount=0;
    pkts.forEach(pkt=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
      items.forEach((item,idx)=>{
        const jt=S.jobTypes.find(j=>j.id===item.job_type_id)||{};
        const cost=parseFloat(item.cost)||0;
        retailerTotal+=cost;retailerItemCount++;
        tb.append(h('tr',{},
          h('td',{className:'mono',style:{fontSize:'12px'}},idx===0?pkt.customer_ref:''),
          h('td',{},idx===0?pkt.surname:''),
          h('td',{},item.item||''),
          h('td',{},jt.name||''),
          h('td',{className:'right'},fmtMoney(cost)),
        ));
      });
      if(!items.length){
        tb.append(h('tr',{},
          h('td',{className:'mono',style:{fontSize:'12px'}},pkt.customer_ref),
          h('td',{},pkt.surname),
          h('td',{colspan:'3',style:{color:'var(--text-muted)',fontSize:'12px'}},'No items'),
        ));
      }
    });

    // Totals row
    tb.append(h('tr',{className:'total-row'},
      h('td',{colspan:'4'},'Total items: '+retailerItemCount),
      h('td',{className:'right'},fmtMoney(retailerTotal)),
    ));

    tbl.append(tb);section.append(tbl);c.append(section);
  });

  return c;
}

function downloadCustomerReportPDF(filteredPackets,cr){
  if(!filteredPackets||!filteredPackets.length){showToast('No data to export',true);return;}
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  let y=15;

  // Helper to add page if needed
  const checkPage=()=>{if(y>270){doc.addPage();y=15;}};

  // Title
  doc.setFontSize(14);doc.setFont('helvetica','bold');
  doc.text('Customer Report',10,y);y+=7;
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text('Generated: '+fmtD(now),10,y);y+=5;
  if(cr.dateRange!=='custom'){
    const dr=getDateRange(cr.dateRange);
    if(dr)doc.text('Period: '+fmtD(dr.from)+' to '+fmtD(dr.to),10,y);
  } else if(cr.dateFrom&&cr.dateTo){
    doc.text('Period: '+cr.dateFrom+' to '+cr.dateTo,10,y);
  }
  y+=8;

  // Group by retailer
  const byRetailer={};
  filteredPackets.forEach(p=>{
    const rid=p.retailer_id;
    if(!byRetailer[rid])byRetailer[rid]=[];
    byRetailer[rid].push(p);
  });

  Object.entries(byRetailer).forEach(([rid,pkts])=>{
    checkPage();
    const retName=retailerName(parseInt(rid));
    doc.setFontSize(12);doc.setFont('helvetica','bold');
    doc.text(retName,10,y);y+=2;
    doc.setLineWidth(0.3);doc.line(10,y,200,y);y+=5;

    // Column headers
    doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('Ref',10,y);doc.text('Surname',40,y);doc.text('Item',80,y);doc.text('Job Type',120,y);doc.text('Cost',185,y);
    y+=4;doc.line(10,y,200,y);y+=4;

    let retailerTotal=0;let retailerItemCount=0;
    pkts.forEach(pkt=>{
      const items=S.allPacketItems.filter(i=>i.packet_id===pkt.id);
      items.forEach((item,idx)=>{
        checkPage();
        const jt=S.jobTypes.find(j=>j.id===item.job_type_id)||{};
        const cost=parseFloat(item.cost)||0;
        retailerTotal+=cost;retailerItemCount++;
        doc.setFontSize(9);doc.setFont('courier','normal');
        doc.text(idx===0?(pkt.customer_ref||''):'',10,y);
        doc.setFont('helvetica','normal');
        doc.text(idx===0?(pkt.surname||''):'',40,y);
        doc.text((item.item||'').substring(0,18),80,y);
        doc.text((jt.name||'').substring(0,20),120,y);
        doc.text(fmtMoney(cost),185,y,{align:'right'});
        y+=5;
      });
      if(!items.length){
        checkPage();
        doc.setFontSize(9);doc.setFont('courier','normal');
        doc.text(pkt.customer_ref||'',10,y);
        doc.setFont('helvetica','normal');
        doc.text(pkt.surname||'',40,y);
        doc.text('No items',80,y);
        y+=5;
      }
    });

    // Retailer totals
    checkPage();
    doc.line(10,y,200,y);y+=4;
    doc.setFontSize(10);doc.setFont('helvetica','bold');
    doc.text('Total items: '+retailerItemCount,10,y);
    doc.text(fmtMoney(retailerTotal),185,y,{align:'right'});
    y+=10;
  });

  const fname='customer_report_'+new Date().toISOString().slice(0,10)+'.pdf';
  doc.save(fname);
}

// MAIN RENDER
//
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  if(!S.ready){app.innerHTML='<div class="loading-screen"><div class="spinner"></div><div class="loading-text">Connecting...</div></div>';return;}
  if(S.toast)app.append(h('div',{className:'toast'+(S.toast.w?' warn':'')},S.toast.m));
  const {sidenav,topbar}=renderNav();
  const shell=h('div',{className:'app-shell'});
  shell.append(sidenav);
  const appBody=h('div',{className:'app-body'});
  appBody.append(topbar);
  const main=h('div',{className:S.view==='home'?'main main-dashboard':'main'});
  if(S.view==='home')main.append(renderHome());
  else if(S.view==='records')main.append(renderRecords());
  else if(S.view==='form')main.append(renderForm(null));
  else if(S.view==='billing')main.append(renderBilling());
  else if(S.view==='reports')main.append(renderReports());
  else if(S.view==='billingRunsReport')main.append(renderBillingRunsReport());
  else if(S.view==='customerReport')main.append(renderCustomerReportPage());
  else if(S.view==='edit'&&S.editId){
    const p=S.packets.find(x=>x.id===S.editId);
    if(p){
      main.append(renderForm(p));
    }else{S.view='home';main.append(renderHome());}
  }
  appBody.append(main);
  shell.append(appBody);
  app.append(shell);
  // Restore focus and cursor position to search inputs only if search had focus before render
  if(S.searchHadFocus){
    const searchInput=app.querySelector('.topbar-search-input')||app.querySelector('.search-input');
    if(searchInput){
      searchInput.focus();
      if(S.searchCursorPos>0){
        searchInput.setSelectionRange(S.searchCursorPos,S.searchCursorPos);
      }
    }
    S.searchHadFocus=false; // reset flag after restoring
  }
}

// Async render -- fetches packet items before rendering edit form
async function renderAsync(){
  if(S.view==='edit'&&S.editId){
    S.editItems=await fetchPacketItems(S.editId);
  } else {
    S.editItems=[];
  }
  render();
}

// Override the nav link clicks and edit buttons to use renderAsync
// (render() itself remains synchronous for all non-edit views)

(async()=>{
  try{await loadAll();S.ready=true;render();}
  catch(e){document.getElementById('app').innerHTML='<div class="loading-screen"><div class="loading-text" style="color:#B85C38;">Connection failed: '+e.message+'<br><br>Check your internet and refresh.</div></div>';}
})();
</script>
