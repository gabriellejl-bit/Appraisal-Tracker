  const cu=getCurrentUser();
  const auditGstRate=cu.gst_registered?(cu.gst_rate||15)/100:0;
  const packetsByRunId=new Map();
  S.packets.forEach(p=>{if(p.shipping_run_id){if(!packetsByRunId.has(p.shipping_run_id))packetsByRunId.set(p.shipping_run_id,[]);packetsByRunId.get(p.shipping_run_id).push(p);}});
  const itemsByPacketId=new Map();
  S.allPacketItems.forEach(i=>{if(!itemsByPacketId.has(i.packet_id))itemsByPacketId.set(i.packet_id,[]);itemsByPacketId.get(i.packet_id).push(i);});

  filtered.forEach(run=>{
    const runPackets=packetsByRunId.get(run.id)||[];
    const shipping=parseFloat(run.shipping_cost)||0;
    const appraisals=runPackets.reduce((s,p)=>{const items=itemsByPacketId.get(p.id)||[];return s+items.reduce((is,i)=>is+(parseFloat(i.cost)||0),0);},0);
    const cost=(appraisals+shipping/1.15)*(1+auditGstRate);
    totalCost+=cost;

    // Build packet detail rows (hidden by default)
    const detailRows=runPackets.map(p=>{
      const items=itemsByPacketId.get(p.id)||[];
      const amount=items.reduce((s,i)=>(s+(parseFloat(i.cost)||0)),0);
      const dr=h('tr',{style:{display:'none',background:'var(--color-secondary)',fontSize:'var(--text-sm)'}});
      dr.append(
        h('td',{}),
        h('td',{style:{paddingLeft:'var(--space-6)',color:'var(--color-muted-foreground)'}},p.customer_ref||''),
        h('td',{colspan:'3'},p.surname||''),
        h('td',{style:{textAlign:'right'}},String(items.length)+' item'+(items.length!==1?'s':'')),
        h('td',{style:{textAlign:'right'}},fmtMoney(amount)),
      );
      return dr;
    });

    // Toggle chevron
    let open=false;
    const chevron=h('span',{style:{display:'inline-block',transition:'transform .15s',color:'var(--color-muted-foreground)',fontSize:'10px'}},'▶');
    const summaryRow=h('tr',{style:{cursor:'pointer'}});
    summaryRow.addEventListener('click',()=>{
      open=!open;
      chevron.style.transform=open?'rotate(90deg)':'';
      detailRows.forEach(dr=>{dr.style.display=open?'':'none';});
    });
    const isNJRun=!!(run.invoice_number);
    const reprintBtn=h('button',{className:'btn-link',style:{fontSize:'var(--text-xs)',whiteSpace:'nowrap'}},isNJRun?'Reprint Invoice':'Reprint Slip');
    reprintBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const runPkts=S.packets.filter(p=>p.shipping_run_id===run.id);
      if(isNJRun){try{printInvoice(runPkts,run.retailer_id,scName(run.sub_customer_id),run.invoice_number,run.ship_date,run.shipping_cost,run.sub_customer_id);}catch(err){console.warn(err);}}
      else{try{printPackingSlip(runPkts,run.retailer_id,scName(run.sub_customer_id),run.ship_date,run.shipping_cost,run.packing_slip_number||null);}catch(err){console.warn(err);}}
    });
    const docRef=run.invoice_number||run.packing_slip_number||'';
    summaryRow.append(
      h('td',{},chevron),
      h('td',{},run.ship_date||''),
      h('td',{},retailerName(run.retailer_id)+(scName(run.sub_customer_id)?' — '+scName(run.sub_customer_id):'')),
      h('td',{style:{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)',color:'var(--color-muted-foreground)'}},docRef),
      h('td',{},run.tracking_last4?'…'+run.tracking_last4:''),
      h('td',{style:{textAlign:'right'}},String(runPackets.length)),
      h('td',{style:{textAlign:'right'}},fmtMoney(cost)),
      h('td',{},reprintBtn),
    );
    tbody.append(summaryRow,...detailRows);
  });

  tbody.append(h('tr',{style:{fontWeight:'var(--font-semibold)',borderTop:'2px solid var(--color-border)'}},
    h('td',{colspan:'6',style:{fontWeight:'var(--font-semibold)'}},'Total ('+filtered.length+' run'+(filtered.length!==1?'s':'')+')'),
    h('td',{style:{textAlign:'right',fontWeight:'var(--font-semibold)'}},fmtMoney(totalCost)),
    h('td',{}),
  ));
  tbl.append(tbody);
  c.append(tbl);
  return c;
}

function renderFulfilmentReport(){
  const sr=S.fulfilmentReport;
  const c=shippingReportFilterBar(sr,'Fulfilment Summary');
  const filtered=filterShippingRuns(sr);

  if(!filtered.length){
    const em=h('div',{className:'empty-state'});em.innerHTML=I.inbox;
    em.append(h('p',{className:'empty-state-title'},'No shipments in this period'),h('p',{className:'empty-state-hint'},'Try a different date range'));
    c.append(em);return c;
  }

  const tbl=h('table',{className:'table'});
  tbl.append(h('thead',{},h('tr',{},
    h('th',{className:'table-header'},'Date'),
    h('th',{className:'table-header'},'Retailer / Sub-customer'),
    h('th',{className:'table-header'},'Tracking'),
    h('th',{className:'table-header',style:{textAlign:'right'}},'Packets'),
    h('th',{className:'table-header',style:{textAlign:'right'}},'Shipping Cost'),
  )));
  const tbody=h('tbody',{});
  let totalCost=0;
  const pktCountByRunId=new Map();
  S.packets.forEach(p=>{if(p.shipping_run_id)pktCountByRunId.set(p.shipping_run_id,(pktCountByRunId.get(p.shipping_run_id)||0)+1);});
  filtered.forEach(run=>{
    const pktCount=pktCountByRunId.get(run.id)||0;
    const cost=parseFloat(run.shipping_cost)||0;
    totalCost+=cost;
    tbody.append(h('tr',{},
      h('td',{},run.ship_date||''),
      h('td',{},retailerName(run.retailer_id)+(scName(run.sub_customer_id)?' — '+scName(run.sub_customer_id):'')),
      h('td',{},run.tracking_last4?'…'+run.tracking_last4:''),
      h('td',{style:{textAlign:'right'}},String(pktCount)),
      h('td',{style:{textAlign:'right'}},fmtMoney(cost)),
    ));
  });
  tbody.append(h('tr',{style:{fontWeight:'var(--font-semibold)',borderTop:'2px solid var(--color-border)'}},
    h('td',{colspan:'4',style:{fontWeight:'var(--font-semibold)'}},'Total ('+filtered.length+' shipment'+(filtered.length!==1?'s':'')+')'),
    h('td',{style:{textAlign:'right',fontWeight:'var(--font-semibold)'}},fmtMoney(totalCost)),
  ));
  tbl.append(tbody);
  c.append(tbl);
  return c;
}

//
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  if(!S.ready){app.innerHTML='<div class="loading-screen"><div class="spinner"></div><div class="loading-text">Connecting...</div></div>';return;}
  if(S.toast)app.append(h('div',{className:'toast'+(S.toast.w?' warn':'')},S.toast.m));
  const {sidenav,topbar}=renderNav();
  const shell=h('div',{className:'app-shell'});
  shell.append(sidenav);
  const appBody=h('div',{className:'app-body'});
  appBody.append(topbar);
  const main=h('div',{className:S.view==='home'?'main main-dashboard':'main'});
  if(S.view==='home')main.append(renderHome());
  else if(S.view==='records')main.append(renderRecords());
  else if(S.view==='form')main.append(renderForm(null));
  else if(S.view==='billing')main.append(renderBilling());
  else if(S.view==='reports')main.append(renderReports());
  else if(S.view==='billingRunsReport')main.append(renderBillingRunsReport());
  else if(S.view==='customerReport')main.append(renderCustomerReportPage());
  else if(S.view==='shipping')main.append(renderShipping());
  else if(S.view==='shippingReport')main.append(renderShippingReport());
  else if(S.view==='fulfilmentReport')main.append(renderFulfilmentReport());
  else if(S.view==='taxInvoices')main.append(renderTaxInvoices());
  else if(S.view==='admin')main.append(renderAdmin());
  else if(S.view==='edit'&&S.editId){
    const p=S.packets.find(x=>x.id===S.editId);
    if(p){
      main.append(renderForm(p));
    }else{S.view='home';main.append(renderHome());}
  }
  appBody.append(main);
  shell.append(appBody);
  app.append(shell);
  // Restore focus and cursor position to search inputs only if search had focus before render
  if(S.searchHadFocus){
    const searchInput=app.querySelector('.topbar-search-input')||app.querySelector('.search-input');
    if(searchInput){
      searchInput.focus();
      if(S.searchCursorPos>0){
        searchInput.setSelectionRange(S.searchCursorPos,S.searchCursorPos);
      }
    }
    S.searchHadFocus=false; // reset flag after restoring
  }
}

// Async render -- fetches packet items before rendering edit form
async function renderAsync(){
  if(S.view==='edit'&&S.editId){
    S.editItems=await fetchPacketItems(S.editId);
  } else {
    S.editItems=[];
  }
  render();
}

// Override the nav link clicks and edit buttons to use renderAsync
// (render() itself remains synchronous for all non-edit views)

(async()=>{
  try{await loadAll();S.ready=true;render();}
  catch(e){document.getElementById('app').innerHTML='<div class="loading-screen"><div class="loading-text" style="color:#B85C38;">Connection failed: '+e.message+'<br><br>Check your internet and refresh.</div></div>';}
})();
</script>
