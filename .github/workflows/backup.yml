name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Runs every day at 2:00 AM UTC
  workflow_dispatch:        # Lets you trigger it manually from the GitHub Actions tab too

permissions:
  contents: write            # Needed so the workflow can commit the backup file

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backups folder if it doesn't exist
        run: mkdir -p backups

      - name: Run the backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          pg_dump "$DATABASE_URL" > "backups/backup_${TIMESTAMP}.sql"

      - name: Commit and push the backup file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "Automated backup $(date +'%Y-%m-%d_%H-%M-%S')" || echo "No changes to commit"
          git push
